<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Randomised Coffee Trial</title>
<style>
:root{
  --bg:#ffffff; --card:#f3eee4; --ink:#2e2a22; --muted:#7d7466; --line:#e3dac9;
  --soft:#f8f4ec; --accent:#9c8a66; --accent-ink:#ffffff; --accent-soft:#ece5d4;
  --good:#5d6e4e; --good-soft:#eceee4; --warn:#8a6440; --warn-soft:#f0e7da;
  --focus:#1f6feb; --shadow:0 1px 2px rgba(60,50,30,.05),0 4px 14px rgba(60,50,30,.05);
  --r:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1b1711; --card:#292419; --ink:#ebe4d6; --muted:#968c78; --line:#3b352a;
    --soft:#231e16; --accent:#b4a07a; --accent-ink:#221c12; --accent-soft:#3c352a;
    --good:#a3b18f; --good-soft:#2e3328; --warn:#c9a37b; --warn-soft:#3a3122;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 18px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#1b1711; --card:#292419; --ink:#ebe4d6; --muted:#968c78; --line:#3b352a;
  --soft:#231e16; --accent:#b4a07a; --accent-ink:#221c12; --accent-soft:#3c352a;
  --good:#a3b18f; --good-soft:#2e3328; --warn:#c9a37b; --warn-soft:#3a3122;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 18px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:15px; line-height:1.5;
}
#protoBanner{
  background:var(--soft); color:var(--muted); text-align:center;
  font-size:11px; padding:4px 16px; border-bottom:1px solid var(--line);
}
/* ---- shell / layouts ---- */
#shell{display:flex; flex-direction:column; min-height:calc(100vh - 26px)}
main{flex:1 1 auto; width:100%; max-width:720px; margin:0 auto; padding:6px 16px 96px}
header.app{
  display:flex; align-items:center; gap:10px;
  padding:10px 16px; width:100%; max-width:720px; margin:0 auto;
}
.logo{display:flex; color:var(--accent)}
.brand h1{font-size:16px; margin:0; letter-spacing:.2px; font-weight:700}
.brand .sub{font-size:11px; color:var(--muted); margin-top:-1px}
.weekchip{margin-left:auto; background:var(--card); border:1px solid var(--line);
  border-radius:999px; padding:3px 12px; font-size:12px; white-space:nowrap; color:var(--muted)}
.statusbar{display:none}
nav.bottom{
  position:sticky; bottom:0; z-index:30; width:100%; max-width:720px; margin:0 auto;
  background:color-mix(in srgb,var(--bg) 82%,transparent);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  display:flex; justify-content:space-around; padding:4px 4px calc(4px + env(safe-area-inset-bottom));
}
nav.bottom:empty{display:none}
nav.bottom button{
  background:none; border:none; font-family:inherit; color:var(--muted);
  font-size:13px; cursor:pointer; padding:9px 14px; border-radius:8px; border-top:2px solid transparent;
  transition:color .15s;
}
nav.bottom button.on{color:var(--ink); font-weight:700; border-top-color:var(--accent)}
#topnav{display:none; gap:2px; margin-left:16px}
#topnav button{border:none; background:none; font-family:inherit; font-size:13px; color:var(--muted);
  padding:7px 13px; border-radius:999px; cursor:pointer; transition:background .15s,color .15s}
#topnav button:hover{background:var(--soft); color:var(--ink)}
#topnav button.on{background:var(--card); color:var(--ink); font-weight:700}
/* desktop layout */
html[data-layout="desktop"] nav.bottom{display:none}
html[data-layout="desktop"] #topnav{display:flex}
html[data-layout="desktop"] header.app{max-width:1000px; padding:12px 28px}
html[data-layout="desktop"] main{max-width:1000px; padding:10px 28px 90px}
html[data-layout="desktop"] .cols{display:grid; grid-template-columns:320px 1fr; gap:22px; align-items:start}
html[data-layout="desktop"] .qawrap{display:grid; grid-template-columns:1fr 1fr; gap:12px}
html[data-layout="desktop"] .qawrap .qa{margin:0}
/* phone frame when mobile layout is viewed on a wide screen */
html.wide[data-layout="mobile"] body{background:radial-gradient(1100px 520px at 50% -40px,var(--soft),var(--bg))}
html.wide[data-layout="mobile"] #framewrap{display:flex; justify-content:center; padding:26px 12px 90px}
html.wide[data-layout="mobile"] #shell{
  width:394px; height:min(830px,calc(100vh - 150px)); min-height:480px;
  background:var(--bg); border:10px solid #16130d; border-radius:48px; overflow:hidden;
  box-shadow:0 34px 90px rgba(35,24,6,.38);
}
html.wide[data-layout="mobile"] main{overflow-y:auto; min-height:0; padding-bottom:28px}
html.wide[data-layout="mobile"] nav.bottom{position:static}
html.wide[data-layout="mobile"] .statusbar{
  display:flex; justify-content:space-between; align-items:center;
  padding:12px 26px 0; font-size:13px; font-weight:700; letter-spacing:.02em;
}
.sbicons{display:flex; gap:5px; align-items:center}
.sbicons i{display:block; background:var(--ink)}
.sbicons i:nth-child(1){width:15px; height:9px; border-radius:2px; opacity:.85;
  clip-path:polygon(0 100%,100% 100%,100% 0,75% 25%,0 75%)}
.sbicons i:nth-child(2){width:20px; height:10px; border-radius:3px; opacity:.9}
/* ---- typography / layout bits ---- */
.pagetitle{font-size:18px; margin:16px 2px 6px; font-weight:800; letter-spacing:-.01em}
.pagetitle.center{text-align:center}
.muted{color:var(--muted); font-size:13px}
.small{font-size:12px}
.center{text-align:center}
.footer{color:var(--muted); font-size:11px; text-align:center; margin:30px 0 10px; padding:0 10px}
hr.soft{border:none; border-top:1px solid var(--line); margin:12px 0}
details{margin:10px 0}
details summary{cursor:pointer; font-weight:600; font-size:13px}
/* ---- panels (chunked sections) ---- */
.card{
  background:var(--card); border:1px solid color-mix(in srgb,var(--line) 70%,transparent);
  border-radius:16px; padding:16px; margin:12px 0; box-shadow:var(--shadow);
}
.card h2{margin:0 0 6px; font-size:16px; font-weight:800; letter-spacing:-.01em}
.card h3{margin:14px 0 6px; font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--muted)}
.card p{margin:6px 0}
.notice{background:var(--soft); border:none; border-radius:var(--r); padding:9px 12px; font-size:13px; margin:8px 0}
.notice.good{background:var(--good-soft)}
.notice.warn{background:var(--warn-soft)}
/* ---- hero (welcome) ---- */
.hero{background:linear-gradient(120deg,var(--accent-soft),var(--card) 45%,var(--accent-soft) 90%);
  background-size:220% 220%; border:none}
.hero .mark{width:46px; height:46px; color:var(--accent)}
/* ---- buttons / inputs ---- */
.btn{
  display:inline-block; border:1px solid var(--accent); background:var(--card); color:var(--accent);
  border-radius:999px; padding:7px 16px; font-size:14px; cursor:pointer; font-weight:600;
  font-family:inherit; margin:4px 6px 4px 0;
  transition:transform .12s ease, box-shadow .2s ease, background .2s ease;
}
.btn:hover{background:var(--accent-soft); box-shadow:0 3px 12px rgba(100,80,40,.14)}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.btn.primary:hover{filter:brightness(.96)}
.btn.small{padding:4px 11px; font-size:12px}
.btn.danger{color:var(--warn); border-color:var(--warn)}
.btn.danger:hover{background:var(--warn-soft)}
.btn[disabled]{opacity:.5; cursor:not-allowed}
.linkbtn{background:none; border:none; color:var(--muted); font-size:12px; cursor:pointer;
  font-family:inherit; text-decoration:underline; padding:4px 2px; margin:2px 8px 2px 0}
.btn:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible,
.linkbtn:focus-visible, .chip:focus-visible, .ttile:focus-visible, .cctile:focus-visible, .fab:focus-visible, .seg button:focus-visible{
  outline:3px solid var(--focus); outline-offset:2px;
}
label.f{display:block; margin:12px 0 3px; font-weight:600; font-size:13px}
label.f .opt{font-weight:400; color:var(--muted)}
input[type=text],input[type=search],input[type=password],select,textarea{
  width:100%; padding:8px 11px; border:1px solid var(--line); border-radius:8px;
  background:var(--bg); color:var(--ink); font-family:inherit; font-size:14px;
}
textarea{min-height:64px; resize:vertical}
/* ---- chips / tags / tiers ---- */
.chips{display:flex; flex-wrap:wrap; gap:6px; margin:8px 0}
.chip{background:var(--bg); border:1px solid var(--line); border-radius:999px;
  padding:4px 12px; font-size:12px; cursor:pointer; font-family:inherit; color:var(--ink);
  transition:border-color .15s, background .15s}
.chip:hover{border-color:var(--accent); background:var(--accent-soft)}
.chip.on{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.chip.static{cursor:default}
.tag{display:inline-block; background:var(--accent-soft); color:var(--ink);
  border-radius:6px; padding:2px 8px; font-size:11px; margin:2px 3px 2px 0}
.tier{display:inline-block; border-radius:6px; padding:2px 10px; font-size:12px; font-weight:600}
.tier.mutual{background:var(--good-soft); color:var(--good)}
.tier.wild{background:var(--warn-soft); color:var(--warn)}
.badge{display:inline-block; background:var(--warn); color:#fff; border-radius:999px; font-size:11px; padding:1px 7px; margin-left:6px; vertical-align:1px}
/* ---- profile ---- */
.pcard{background:var(--card); border:1px solid color-mix(in srgb,var(--line) 70%,transparent);
  border-radius:16px; overflow:hidden; margin:12px 0; box-shadow:var(--shadow)}
.pcover{height:88px; background:linear-gradient(135deg,var(--accent-soft) 0%,var(--accent) 100%);
  background-size:180% 180%}
.avatar{width:72px; height:72px; border-radius:50%; background:var(--accent); color:var(--accent-ink);
  display:flex; align-items:center; justify-content:center; font-size:28px; font-weight:700;
  border:3px solid var(--card); margin:-40px 0 0 16px; position:relative}
.phead{padding:4px 16px 14px}
.phead h2{margin:6px 0 0; font-size:18px}
.qawrap{margin:4px 0}
.qa{margin:10px 0; background:var(--card); border:1px solid color-mix(in srgb,var(--line) 70%,transparent);
  border-radius:var(--r); padding:10px 14px; box-shadow:var(--shadow)}
.qa .q{font-size:11px; color:var(--muted); margin-bottom:2px; text-transform:uppercase; letter-spacing:.04em}
.qa .a{font-size:14px}
/* panels nested inside .card lose double chrome */
.card .qa{box-shadow:none; background:var(--soft)}
/* ---- countdown ---- */
.countdown{display:flex; gap:12px; justify-content:center; margin:12px 0}
.countdown .tcell{text-align:center; min-width:78px; background:var(--bg); border:1px solid var(--line);
  border-radius:14px; padding:12px 8px; box-shadow:var(--shadow)}
.countdown .n{font-size:26px; font-weight:800; font-variant-numeric:tabular-nums}
.countdown .l{font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em}
/* ---- topic tiles ---- */
.topicwrap{text-align:center}
.topicwrap .grphead{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin-top:14px}
.topicgrid{display:flex; flex-wrap:wrap; justify-content:center; gap:10px; margin:10px 0}
.ttile{background:var(--bg); border:1px solid var(--line); border-radius:14px;
  width:160px; min-height:64px; display:flex; align-items:center; justify-content:center; text-align:center;
  padding:10px; font-size:13px; font-family:inherit; color:var(--ink); cursor:pointer;
  transition:transform .15s ease, box-shadow .2s ease, border-color .2s ease}
.ttile:hover{transform:translateY(-2px); box-shadow:0 8px 20px rgba(90,70,35,.14); border-color:var(--accent)}
.ttile.on{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
/* ---- spotlight (React-Bits-style) ---- */
.spot{position:relative; overflow:hidden}
.spot::after{content:''; position:absolute; inset:0; opacity:0; transition:opacity .25s; pointer-events:none;
  background:radial-gradient(150px circle at var(--mx,50%) var(--my,50%), color-mix(in srgb,var(--accent) 20%,transparent), transparent 70%)}
.spot:hover::after{opacity:1}
/* ---- list rows ---- */
.listlink{display:flex; align-items:center; gap:12px; width:100%; text-align:left;
  background:var(--card); border:1px solid color-mix(in srgb,var(--line) 70%,transparent); border-radius:14px;
  padding:13px 14px; margin:8px 0; font-family:inherit; font-size:14px; color:var(--ink); cursor:pointer;
  box-shadow:var(--shadow); transition:transform .15s ease, box-shadow .2s ease}
.listlink:hover{transform:translateY(-1px); box-shadow:0 8px 20px rgba(90,70,35,.13)}
.listlink .d{color:var(--muted); font-size:12px; display:block; font-weight:400}
.listlink b{font-weight:700}
/* ---- profile section tools ---- */
.sectlabel{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin:12px 2px 2px; font-weight:700}
.proftools{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:6px 0 12px}
.proftools .listlink{margin:0; background:var(--bg); border:1px solid color-mix(in srgb,var(--accent) 55%,transparent)}
.proftools .listlink b{color:var(--accent)}
.proftools .chev{margin-left:auto; color:var(--accent); font-size:20px; line-height:1}
@media (max-width:380px){ .proftools{grid-template-columns:1fr} }
/* ---- chat / slots ---- */
.msg{max-width:85%; padding:7px 11px; border-radius:14px; margin:4px 0; font-size:13px}
.msg.me{background:var(--accent); color:var(--accent-ink); margin-left:auto; border-bottom-right-radius:4px}
.msg.them{background:var(--bg); border:1px solid var(--line); border-bottom-left-radius:4px}
.msg .who{font-size:10px; opacity:.75; display:block}
.chatbox{display:flex; gap:6px; margin-top:8px}
.chatbox input{flex:1}
.slot{display:flex; align-items:center; gap:8px; background:var(--bg); border:1px solid var(--line);
  border-radius:var(--r); padding:8px 11px; margin:6px 0; font-size:13px; box-shadow:var(--shadow)}
.slot .btn{margin:0 0 0 auto}
.slot.chosen{background:var(--good-soft); font-weight:600}
/* ---- stats / sparks ---- */
.statrow{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; margin:12px 0}
.stat{background:var(--card); border:1px solid color-mix(in srgb,var(--line) 70%,transparent);
  border-radius:14px; padding:12px; text-align:center; box-shadow:var(--shadow)}
.stat .n{font-size:22px; font-weight:800}
.stat .l{font-size:11px; color:var(--muted)}
.spark{border-left:3px solid var(--accent); padding:4px 12px; margin:12px 0}
.spark .meta{font-size:11px; color:var(--muted)}
.spark .t{font-size:14px; font-style:italic}
/* ---- misc ---- */
.steps{display:flex; gap:6px; margin:6px 0 14px}
.steps span{flex:1; height:4px; border-radius:2px; background:var(--line)}
.steps span.on{background:var(--accent)}
.howgrid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px}
.howgrid div{background:color-mix(in srgb,var(--bg) 65%,transparent); border-radius:12px; padding:10px 12px; font-size:13px}
.howgrid b{display:block; margin-bottom:2px}
.orcidbox{border:1px solid var(--line); border-radius:var(--r); padding:14px; margin:10px 0; background:var(--soft)}
.orcidbox .obh{font-weight:700; font-size:13px; margin-bottom:6px}
.searchres{border:1px solid var(--line); border-radius:var(--r); margin-top:6px; overflow:hidden; background:var(--bg)}
.searchres .grp{background:var(--soft); padding:4px 12px; font-size:11px; color:var(--muted); font-weight:600}
.searchres button{display:block; width:100%; text-align:left; background:var(--bg); color:var(--ink);
  border:none; border-top:1px solid var(--line); padding:8px 12px; font-size:13px; font-family:inherit; cursor:pointer}
.searchres button:hover{background:var(--accent-soft)}
.diag{font-size:12px}
.diag table{width:100%; border-collapse:collapse; margin:8px 0}
.diag td,.diag th{border-bottom:1px solid var(--line); padding:5px 6px; text-align:left; vertical-align:top}
.toastwrap{position:fixed; bottom:96px; left:0; right:0; display:flex; justify-content:center; z-index:70; pointer-events:none}
.toast{background:var(--ink); color:var(--bg); border-radius:10px; padding:8px 16px; font-size:13px;
  box-shadow:0 10px 30px rgba(0,0,0,.25); animation:ccIn .22s ease both}
/* ---- control centre ---- */
.fab{position:fixed; right:18px; bottom:18px; z-index:60; width:52px; height:52px; border-radius:50%;
  border:1px solid color-mix(in srgb,var(--line) 70%,transparent);
  background:color-mix(in srgb,var(--card) 78%,transparent);
  backdrop-filter:blur(16px) saturate(1.3); -webkit-backdrop-filter:blur(16px) saturate(1.3);
  box-shadow:0 8px 28px rgba(45,32,10,.22); cursor:pointer; color:var(--ink);
  display:flex; align-items:center; justify-content:center; transition:transform .15s ease, box-shadow .2s ease}
.fab:hover{transform:translateY(-2px); box-shadow:0 12px 34px rgba(45,32,10,.28)}
.fab:active{transform:scale(.92)}
html[data-layout="mobile"]:not(.wide) .fab{bottom:72px}
.ccpanel{position:fixed; right:18px; bottom:82px; z-index:59; width:350px; max-width:calc(100vw - 24px);
  max-height:calc(100vh - 120px); overflow-y:auto;
  background:color-mix(in srgb,var(--card) 74%,transparent);
  backdrop-filter:blur(26px) saturate(1.4); -webkit-backdrop-filter:blur(26px) saturate(1.4);
  border:1px solid color-mix(in srgb,var(--line) 70%,transparent); border-radius:22px;
  box-shadow:0 24px 70px rgba(35,24,6,.3); padding:14px; animation:ccIn .25s cubic-bezier(.2,.7,.3,1) both}
html[data-layout="mobile"]:not(.wide) .ccpanel{left:12px; right:12px; width:auto; bottom:134px}
@keyframes ccIn{from{opacity:0; transform:translateY(12px) scale(.97)} to{opacity:1; transform:none}}
.cchead{display:flex; align-items:baseline; gap:8px; margin-bottom:10px}
.cchead b{font-size:14px}
.ccclose{margin-left:auto; border:none; background:var(--soft); color:var(--muted); width:26px; height:26px;
  border-radius:50%; cursor:pointer; font-size:15px; line-height:1; font-family:inherit}
.ccstats{display:flex; gap:8px; margin-bottom:10px}
.ccstats>div{flex:1; background:color-mix(in srgb,var(--bg) 70%,transparent); border-radius:12px; padding:8px 10px}
.ccstats b{display:block; font-size:13px}
.ccstats span{display:block; font-size:11px; color:var(--muted)}
.ccgrid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:8px 0}
.cctile{background:color-mix(in srgb,var(--bg) 70%,transparent);
  border:1px solid color-mix(in srgb,var(--line) 60%,transparent); border-radius:14px; padding:10px 12px;
  text-align:left; font-family:inherit; color:var(--ink)}
.cctile.wide{margin:8px 0}
.cctile.act{cursor:pointer; transition:transform .13s ease, box-shadow .2s ease}
.cctile.act:hover{transform:translateY(-1px); box-shadow:0 6px 18px rgba(45,32,10,.16)}
.cctile.act:active{transform:scale(.96)}
.cctile .ck{display:block; font-weight:700; font-size:13px}
.cctile .cv{display:block; font-size:11px; color:var(--muted); margin-top:1px}
.cctile.prime{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.cctile.prime .cv{color:color-mix(in srgb,var(--accent-ink) 72%,transparent)}
.cctile.dim{opacity:.45}
.cctile.dangert .ck{color:var(--warn)}
.cclabel{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; display:block; margin-bottom:3px}
.seg{display:flex; background:color-mix(in srgb,var(--bg) 70%,transparent); border-radius:10px; padding:3px; gap:3px; margin:2px 0 8px}
.seg button{flex:1; border:none; background:none; border-radius:8px; padding:5px 0; font-size:12px;
  font-family:inherit; color:var(--muted); cursor:pointer; transition:background .15s,color .15s}
.seg button.on{background:var(--card); color:var(--ink); font-weight:700; box-shadow:0 1px 4px rgba(0,0,0,.14)}
/* ---- motion ---- */
@media (prefers-reduced-motion: no-preference){
  #app>*{animation:fadeUp .4s cubic-bezier(.2,.7,.3,1) both}
  #app>*:nth-child(2){animation-delay:.05s}
  #app>*:nth-child(3){animation-delay:.1s}
  #app>*:nth-child(4){animation-delay:.15s}
  #app>*:nth-child(5){animation-delay:.2s}
  #app>*:nth-child(6){animation-delay:.25s}
  #app>*:nth-child(n+7){animation-delay:.3s}
  .hero{animation:heroShift 12s ease-in-out infinite alternate}
  .pcover{animation:heroShift 16s ease-in-out infinite alternate}
}
#app.noanim>*{animation:none !important}
@keyframes fadeUp{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none}}
@keyframes heroShift{from{background-position:0% 0%} to{background-position:100% 100%}}
</style>
</head>
<body>
<div id="protoBanner">Prototype – simulated data, nothing is sent or stored on a server. Everyone here is fictional.</div>
<div id="framewrap"><div id="shell">

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function haversine(a,b){
  const R=6371, rad=x=>x*Math.PI/180;
  const dLat=rad(b.lat-a.lat), dLon=rad(b.lon-a.lon);
  const h=Math.sin(dLat/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
function lev(a,b){
  if(Math.abs(a.length-b.length)>2)return 9;
  const m=[...Array(a.length+1)].map((_,i)=>[i,...Array(b.length)]);
  for(let j=0;j<=b.length;j++)m[0][j]=j;
  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)
    m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return m[a.length][b.length];
}
let toastT=null;
function toast(msg){
  const w=document.getElementById('toastwrap');

/* similarity: single swappable function (replace with embeddings in the real version) */
function similarity(a,b){
  if(a===b)return 1;
  const k=[a,b].sort().join('|');
  if(RELATED[k]!=null)return RELATED[k];
  const A=TOPIC[a],B=TOPIC[b];
  if(!A||!B)return 0;
  if(A.sub===B.sub)return 0.8;
  if(A.div===B.div)return 0.5;
  return 0.1;
}
/* interestScore(A -> B): how well B's background satisfies A's interests.
   Choice documented: we use the BEST-satisfied interest (max), not the average,
   so one strong shared curiosity is enough to count as "wants to learn their field". */
function interestScore(A,B){
  let best=0;
  for(const i of A.interestTopics){
    for(const g of B.backgroundTopics){ const s=similarity(i,g); if(s>best)best=s; }
  }
  return best;
}

const T_MUTUAL=0.75;
function pairEval(A,B){
  /* hard filters */
  if(isPaused(A)||isPaused(B))return {ok:false,why:'paused'};
  if(!A.verified||!B.verified)return {ok:false,why:'unverified'};
  if(A.matchedBefore.includes(B.id))return {ok:false,why:'already matched before (never re-matched)'};
  if(A.blocked.includes(B.id)||B.blocked.includes(A.id))return {ok:false,why:'blocked'};
  const d=userDist(A,B);
  if(d>A.maxKm||d>B.maxKm)return {ok:false,why:'outside travel range ('+d.toFixed(0)+' km)'};
  const overlap=A.availability.filter(w=>B.availability.includes(w));
  if(overlap.length===0)return {ok:false,why:'no availability overlap'};
  /* scores and tier */
  const sAB=interestScore(A,B), sBA=interestScore(B,A);
  const mutual=sAB>=T_MUTUAL&&sBA>=T_MUTUAL;
  const oneWay=!mutual&&(sAB>=T_MUTUAL||sBA>=T_MUTUAL);
  const tier=mutual?'mutual':oneWay?'oneWay':'open';
  const union=new Set([...A.availability,...B.availability]).size;
  const diffDiv=TOPIC[A.backgroundTopics[0]].div!==TOPIC[B.backgroundTopics[0]].div;
  const tierBase=mutual?1000:oneWay?500:0;
  const topicBonus=40*(sAB+sBA)/2;
  const prox=Math.max(0,15*(1-d/Math.min(A.maxKm,B.maxKm)));
  const avail=10*(overlap.length/union);
  const bridge=(tier==='open'&&diffDiv)?10:0;
  const carry=25*(A.unmatchedLastWeek?1:0)+25*(B.unmatchedLastWeek?1:0);
  const weight=tierBase+topicBonus+prox+avail+bridge+carry;
  return {ok:true,tier,sAB,sBA,d,overlap,weight,parts:{tierBase,topicBonus,prox,avail,bridge,carry}};
}

const PICK={q:'',kind:null};
function searchTopics(q){
  q=q.trim().toLowerCase(); if(q.length<2)return[];
  const qTokens=q.split(/\s+/);
  const scored=[];
  for(const id in TOPIC){
    const t=TOPIC[id];
    const cands=[t.label.toLowerCase(),...t.syn.map(s=>s.toLowerCase()),t.subLabel.toLowerCase()];
    let best=0;
    for(const c of cands){
      if(c===q)best=Math.max(best,5);
      else if(c.includes(q))best=Math.max(best,4);
      else{
        const cTok=c.split(/\s+/);
        let hit=0;
        for(const qt of qTokens){
          if(cTok.some(ct=>ct.startsWith(qt)))hit+=2;
          else if(qt.length>3&&cTok.some(ct=>lev(qt,ct)<=2))hit+=1;
        }
        best=Math.max(best,hit/qTokens.length);
      }
    }
    if(best>=1)scored.push({id,best});
  }
  scored.sort((a,b)=>b.best-a.best);
  return scored.slice(0,8).map(s=>s.id);
}

function topicArr(kind){

  if(!target)return[];
  if(kind==='bg'){ target.backgroundTopics=target.backgroundTopics||[]; return target.backgroundTopics; }
  target.interestTopics=target.interestTopics||[]; return target.interestTopics;
}
function topicsNearby(u){
  /* topics held by active profiles within the user's travel range; names only, no counts, no identities */
  const set=new Set();
  Object.values(S.users).forEach(o=>{
    if(o.id===u.id||!o.verified||isPaused(o))return;
    if(!u.area||!o.area)return;
    if(userDist(u,o)<=u.maxKm)o.backgroundTopics.forEach(t=>set.add(t));
  });
  (u.backgroundTopics||[]).forEach(t=>set.delete(t));
  return [...set];
}
let NEARBY_SHUFFLE=1;
function nearbyListHtml(u,selected){
  const all=topicsNearby(u);
  if(all.length===0)return '<div class="notice center">No topics from nearby researchers yet. '+esc(HONESTY)+'</div>';
  /* deterministic shuffle so Refresh visibly reorders */
  const arr=[...all].sort((a,b)=>((a+NEARBY_SHUFFLE).split('').reduce((x,c)=>x+c.charCodeAt(0),0))-((b+NEARBY_SHUFFLE).split('').reduce((x,c)=>x+c.charCodeAt(0),0)));
  const show=arr.slice(0,12);
  const bySub={};
  show.forEach(id=>{const t=TOPIC[id];(bySub[t.sub]=bySub[t.sub]||[]).push(id);});
  return '<div class="topicwrap"><p class="muted small">Things a few researchers near you could talk about (no names, no numbers):</p>'
    +Object.keys(bySub).map(sub=>{
      const first=TOPIC[bySub[sub][0]];
      return '<div class="grphead">'+esc(first.subLabel)+'</div><div class="topicgrid">'
        +bySub[sub].map(id=>'<button type="button" class="ttile spot'+(selected.includes(id)?' on':'')+'" data-action="toggleNearby" data-topic="'+id+'">'+esc(TOPIC[id].label)+'</button>').join('')+'</div>';
    }).join('')
    +'<button class="btn small" data-action="refreshNearby">↻ Refresh this list</button></div>';
}

V.dashboard=function(){
  const happened=S.matches.filter(m=>m.status==='happened');
  const all=S.matches.filter(m=>['happened','scheduled','planning','noShow','cancelled'].includes(m.status));
  const mut=all.filter(m=>m.tier==='mutual').length;
  const pcMut=all.length?Math.round(100*mut/all.length):0;
  const sv=S.surveys;
  const learned=sv.length?Math.round(100*sv.filter(s=>s.learnedUnexpected>=4).length/sv.length):0;
  /* disciplinary distance: 1 - best similarity between the pair's background topics (aggregate only) */
  let dd=0;
  if(happened.length){
    dd=happened.reduce((acc,m)=>{
      const A=S.users[m.a],B=S.users[m.b]; if(!A||!B)return acc;
      let best=0; A.backgroundTopics.forEach(x=>B.backgroundTopics.forEach(y=>{const s=similarity(x,y); if(s>best)best=s;}));
      return acc+(1-best);
    },0)/happened.length;
  }
  const counts={}; Object.values(S.users).forEach(u=>{const n=S.matches.filter(m=>m.a===u.id||m.b===u.id).length; if(n>1)counts[u.id]=n;});
  const repeat=Object.keys(counts).length;
  const pauses=S.feedback.filter(f=>f.kind==='pause');
  return '<button class="btn small" data-action="nav" data-v="more">← More</button>'
   +'<div class="card"><h2>Impact dashboard</h2><p class="muted small">Aggregates only. No individual data, ever. (The sort of numbers a funder would ask for.)</p>'
   +'<div class="statrow">'
   +'<div class="stat"><div class="n">'+happened.length+'</div><div class="l">meetups happened</div></div>'
   +'<div class="stat"><div class="n">'+pcMut+'%</div><div class="l">mutual (vs wildcard)</div></div>'
   +'<div class="stat"><div class="n">'+learned+'%</div><div class="l">learned something unexpected</div></div>'
   +'<div class="stat"><div class="n">'+dd.toFixed(2)+'</div><div class="l">avg disciplinary distance (0–1)</div></div>'
   +'<div class="stat"><div class="n">'+repeat+'</div><div class="l">people with repeat meetups</div></div>'
   +'<div class="stat"><div class="n">'+pauses.length+'</div><div class="l">pauses recorded</div></div>'
   +'</div>'
   +(pauses.length?'<h3>Why people pause</h3><ul class="small">'+pauses.map(p=>'<li>'+esc(p.text||'(no reason given)')+'</li>').join('')+'</ul>':'')
   +'</div>';
};

V.explain=function(){

   +'<div class="card diag"><h2>How was this decided?</h2>'
   +'<p class="notice warn small"><b>Demo/admin view only.</b> Real users never see this: it exposes other people’s private interests via scores.</p>';
  if(!d){ out+='<p>No matching run yet. Use "Run this week’s matching" in the control centre.</p></div>'; return out; }
  out+='<p class="small">Week '+wk+': '+d.pairs+' pairs made. Mutual pairs (both topic-fit scores ≥ '+T_MUTUAL+') always outrank wildcards (base weight 1000 vs 500 vs 0). Topic fit uses the curated similarity layer, so "chronic pain" and "low back pain" score 0.9. Greedy pairing with a swap pass, not guaranteed optimal.</p>';
  if(d.unmatched.length)out+='<p class="small"><b>Unmatched this week (get carry-over priority):</b> '+d.unmatched.map(id=>esc(S.users[id]?S.users[id].displayName:id)).join(', ')+'</p>';
  if(u&&d.perUser[u.id]){
    const pu=d.perUser[u.id];
    const cands=[...pu.candidates].sort((a,b)=>(b.ev.ok?b.ev.weight:-1)-(a.ev.ok?a.ev.weight:-1));
    out+='<h3>Candidates for '+esc(u.displayName)+'</h3><table><tr><th>Person</th><th>Outcome</th></tr>'
     +cands.map(c=>{
       const o=S.users[c.id]; const name=o?o.displayName:c.id;
       if(!c.ev.ok)return '<tr><td>'+esc(name)+'</td><td>✕ excluded: '+esc(c.ev.why)+'</td></tr>';
       const chosen=pu.matchedWith===c.id;
       const pr=c.ev.parts;
       return '<tr><td>'+esc(name)+(chosen?' <b>← matched</b>':'')+'</td><td>'+c.ev.tier+' · weight '+c.ev.weight.toFixed(1)
        +'<br><span class="muted">fit '+c.ev.sAB.toFixed(2)+' / '+c.ev.sBA.toFixed(2)+' · '+c.ev.d.toFixed(1)+' km · base '+pr.tierBase+' + topics '+pr.topicBonus.toFixed(1)+' + prox '+pr.prox.toFixed(1)+' + avail '+pr.avail.toFixed(1)+' + bridge '+pr.bridge+' + carry '+pr.carry+'</span></td></tr>';
     }).join('')+'</table>';
    if(!pu.matchedWith)out+='<p class="small">'+esc(u.displayName)+' went unmatched: '+(pu.candidates.some(c=>c.ev.ok)?'every eligible candidate was taken by a heavier pair (odd one out).':'no candidate passed the hard filters (range, availability, history, blocks, pause).')+'</p>';
  } else if(u) out+='<p class="small">'+esc(u.displayName)+' was not in that run (paused or added later).</p>';
  out+='</div>';
  return out;
};

    toast('Signed in with ORCID (simulated). Your iD stays private.');
  },
  onbNext:()=>{ S.onb.step++; render(); },
  onbBack:()=>{ S.onb.step=Math.max(1,S.onb.step-1); render(); },
  onbStep2Next:()=>{
    const d=S.onb.draft, g=id=>{const el=document.getElementById(id);return el?el.value.trim():'';};
    d.displayName=g('f-name'); d.pronouns=g('f-pr'); d.institution=g('f-inst');
    d.background=g('f-bg'); d.stuckOn=g('f-stuck'); d.wantExplained=g('f-want'); d.canExplain=g('f-can'); d.nonWork=g('f-fun');
    if(!d.displayName){ toast('A first name or display name is the one thing we need'); return; }
    S.onb.step=3; render();
  },
  onbAvail:d=>{ const a=S.onb.draft.availability; const i=a.indexOf(d.w); i>=0?a.splice(i,1):a.push(d.w);
    const area=document.getElementById('f-area'),km=document.getElementById('f-km');
    if(area)S.onb.draft.area=area.value; if(km)S.onb.draft.maxKm=+km.value; render(); },
  onbStep3Next:()=>{
    const d=S.onb.draft;
    d.area=document.getElementById('f-area').value; d.maxKm=+document.getElementById('f-km').value;
    if(!d.availability.length){ toast('Pick at least one time you’re usually free'); return; }
    S.onb.step=4; render();
  },
  onbFinish:()=>{
    const d=S.onb.draft;
    if(!(d.backgroundTopics||[]).length){ toast('Add at least one topic you know about'); return; }
    if(!(d.interestTopics||[]).length){ toast('Pick at least one thing you’d love to learn about'); return; }
    S.users.me={id:'me',displayName:d.displayName,pronouns:d.pronouns||'',institution:d.institution||'',
      verified:true,background:d.background||'',stuckOn:d.stuckOn||'',wantExplained:d.wantExplained||'',
      canExplain:d.canExplain||'',nonWork:d.nonWork||'',backgroundTopics:d.backgroundTopics,
      interestTopics:d.interestTopics,area:d.area,maxKm:d.maxKm,availability:d.availability,
      pausedUntilWeek:0,pauseReason:'',unmatchedLastWeek:false,blocked:[],matchedBefore:[]};
    S.me='me'; goto('home'); toast('Welcome aboard.');
  },
  pickTopic:d=>{ const arr=topicArr(d.kind); if(!arr.includes(d.topic))arr.push(d.topic); PICK.q=''; render(); },
  unpickTopic:d=>{ const arr=topicArr(d.kind); const i=arr.indexOf(d.topic); if(i>=0)arr.splice(i,1); render(); },
  toggleNearby:d=>{ const arr=topicArr('int'); const i=arr.indexOf(d.topic); i>=0?arr.splice(i,1):arr.push(d.topic); render(); },
  refreshNearby:()=>{ NEARBY_SHUFFLE++; render(); toast('Refreshed from profiles near you'); },
  toggleAvail:d=>{ const a=me().availability; const i=a.indexOf(d.w); if(i>=0){ if(a.length===1){toast('Keep at least one window');return;} a.splice(i,1);} else a.push(d.w); render(); },
  openMatch:d=>{ S.sel=d.m; S.view='match'; resetMstate(); render(); scrollTopAll(); },
  proposeSlot:d=>{
    const m=S.matches.find(x=>x.id===d.m);
    const day=document.getElementById('slotDay').value, win=document.getElementById('slotWin').value;
    const venEl=document.getElementById('slotVenue'), durEl=document.getElementById('slotDur');
    m.slots.push({day,window:win,venue:venEl?venEl.value:null,duration:durEl?durEl.value:null,by:S.me});
    render();
  },
  acceptSlot:d=>{
    const m=S.matches.find(x=>x.id===d.m);
    m.chosenSlot={...m.slots[+d.i],i:+d.i}; m.status='scheduled';
    if(m.chosenSlot.venue)m.venueType=m.chosenSlot.venue;
    if(m.chosenSlot.duration)m.duration=m.chosenSlot.duration;
    m.meetAt=nextDayDate(m.chosenSlot.day,WHOUR[m.chosenSlot.window]!==undefined?WHOUR[m.chosenSlot.window]:12);
    render(); toast('Meet up organised!');
  },
  planCoffee:()=>{ MSTATE.plan=true; render(); scrollTopAll(); },
  toggleEdit:()=>{ MSTATE.editOpen=!MSTATE.editOpen; render(); },
  aboutPartner:()=>{ MSTATE.aboutOpen=true; render(); scrollTopAll(); },
  aboutClose:()=>{ MSTATE.aboutOpen=false; render(); scrollTopAll(); },
  proposeOther:()=>{ MSTATE.proposeOpen=true; render(); },
  openChat:()=>{ MSTATE.chatOpen=!MSTATE.chatOpen; render(); },
  openNotes:()=>{ MSTATE.notesOpen=true; render(); },
  openSurvey:()=>{ MSTATE.surveyOpen=true; render(); },
  changeTime:d=>{
    const m=S.matches.find(x=>x.id===d.m);
    m.chosenSlot=null; m.meetAt=null; m.status='planning'; MSTATE.proposeOpen=true;
    render(); toast('No stress. Agree on a new time.');
  },
  simMeet:()=>{
    const u=me(); if(!u){ toast('Pick a persona first'); return; }
    const m=weekRun(S.week)?matchFor(u.id,S.week):null;
    if(!m||m.status!=='scheduled'||!m.meetAt){ toast('No organised meet-up for this persona this week'); return; }
    m.meetAt=Date.now()-60000; S.sel=m.id; S.view='match'; MSTATE.plan=true;
    render(); toast('Meet-up time reached (simulated)');
  },
  setVenue:d=>{ S.matches.find(x=>x.id===d.m).venueType=d.v; render(); },
  setDuration:d=>{ S.matches.find(x=>x.id===d.m).duration=d.v; render(); },
  sendMsg:d=>{
    const i=document.getElementById('chatIn'); const t=i?i.value.trim():'';
    if(!t)return;
    S.matches.find(x=>x.id===d.m).messages.push({from:S.me,text:t}); render();
  },
  cantMake:d=>{
    if(!confirm('End this match for the week? No penalty, and it’s logged kindly.'))return;
    const m=S.matches.find(x=>x.id===d.m); m.status='cancelled';
    S.feedback.push({userId:S.me,week:S.week,kind:'cantMake',text:'Could not make it in week '+m.week});
    goto('home'); toast('All good. See you next week.');
  },
  blockUser:d=>{
    const m=S.matches.find(x=>x.id===d.m); const p=partnerOf(m,S.me);
    if(!confirm('Block '+p.displayName+'? You’ll never be matched again and this match ends.'))return;
    me().blocked.push(p.id); m.status='cancelled'; goto('home'); toast('Blocked. You’re in control here.');
  },
  reportUser:d=>{
    const m=S.matches.find(x=>x.id===d.m); const p=partnerOf(m,S.me);
    const why=prompt('What happened? This goes privately to the team (demo).');
    if(why==null)return;
    S.feedback.push({userId:S.me,week:S.week,kind:'report',text:'Report about '+p.id+': '+why});
    toast('Report logged (demo). Thank you for telling us.');
  },
  runMatch:runMatching,
  advWeek:advanceWeek,
  reset:resetDemo,
  ccToggle:()=>{ S.ccOpen=!S.ccOpen; render(); },
  layoutSet:d=>{ S.layout=d.l; render(); },
  resumeNow:()=>{ const u=me(); u.pausedUntilWeek=0; u.pauseReason=''; render(); toast('Welcome back.'); },
  copyInvite:()=>{
    const txt='Fancy a coffee with a curious stranger? I’m trying the Randomised Coffee Trial: one researcher, one coffee, once a week. (Demo link: this prototype runs locally.)';
    const done=()=>toast('Invite copied');
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(done,()=>toast('Could not copy on this browser'));
    else toast('Copy not available in this browser');
  },
  theme:d=>{ S.theme=d.t; render(); },
  deleteAccount:()=>{
    const u=me();
    if(!confirm('Delete '+u.displayName+'’s account (demo)? Their matches and surveys go too.'))return;
    S.matches=S.matches.filter(m=>m.a!==u.id&&m.b!==u.id);
    S.surveys=S.surveys.filter(s=>s.userId!==u.id);
    Object.values(S.users).forEach(o=>{
      o.blocked=o.blocked.filter(x=>x!==u.id); o.matchedBefore=o.matchedBefore.filter(x=>x!==u.id);
    });
    delete S.users[u.id]; S.me=null; goto('home'); toast('Account deleted (demo)');
  }
};
const FORMS={
  editProfile:(f)=>{
    const u=me(); const fd=new FormData(f);
    ['displayName','pronouns','institution','background','stuckOn','wantExplained','canExplain','nonWork','area'].forEach(k=>u[k]=String(fd.get(k)||'').trim());
    u.maxKm=+fd.get('maxKm'); MSTATE.editOpen=false; render(); toast('Profile saved');
  },
  logMeetup:(f,d)=>{
    const m=S.matches.find(x=>x.id===d.m); const fd=new FormData(f);
    const h=fd.get('happened');
    if(h==='yes'){ m.status='happened'; m.logged={happened:'yes',duration:String(fd.get('dur')||'').trim()}; toast('Logged. One quick survey when you’re ready.'); }
    else if(h==='rescheduled'){ m.status='planning'; m.chosenSlot=null; m.meetAt=null; MSTATE.plan=true; MSTATE.proposeOpen=true; toast('No stress. Propose a new time.'); }
    else { m.status='noShow'; m.logged={happened:'no'}; toast('Logged. Sorry it didn’t work out this week.'); }
    render();
  },
  survey:(f,d)=>{
    const fd=new FormData(f);
    S.surveys.push({matchId:d.m,userId:S.me,comfort:+fd.get('comfort'),learnedUnexpected:+fd.get('learned'),
      takeaway:String(fd.get('takeaway')||'').trim(),wouldRepeat:!!fd.get('repeat'),recommend:!!fd.get('recommend'),
      safetyConcern:String(fd.get('safety')||'').trim(),privateFeedback:String(fd.get('fb')||'').trim(),
      publicShare:!!fd.get('pub'),publicNamed:!!fd.get('named')});
    if(String(fd.get('safety')||'').trim())S.feedback.push({userId:S.me,week:S.week,kind:'safety',text:String(fd.get('safety'))});
    render(); toast('Thanks, that helps everyone.');
  },
  notes:(f,d)=>{
    const m=S.matches.find(x=>x.id===d.m); const fd=new FormData(f);
    m.notes=m.notes||{};
    m.notes[S.me]={text:String(fd.get('text')||'').trim(),shared:!!fd.get('shared')};
    MSTATE.notesOpen=true; render();
    toast(fd.get('shared')?'Notes saved and shared':'Notes saved, just for you');
  },
  contact:(f,d)=>{
    const m=S.matches.find(x=>x.id===d.m); const fd=new FormData(f);
    const details=String(fd.get('details')||'').trim();
    if(!details){ toast('Add what you’d like to share first'); return; }
    m.contactShare[S.me]={optIn:true,details}; render(); toast('Shared. Revealed only if they opt in too.');
  },
  pause:(f)=>{
    const u=me(); const fd=new FormData(f);
    const len=+fd.get('len');
    u.pausedUntilWeek=len===9999?9999:S.week+len;
    const why=[String(fd.get('why')||''),String(fd.get('txt')||'').trim()].filter(Boolean).join(': ');
    u.pauseReason=why;
    if(why)S.feedback.push({userId:u.id,week:S.week,kind:'pause',text:why});
    goto('home'); toast('Paused. Come back whenever.');
  }
};
/* ============ event wiring ============ */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-action]');
  if(!el)return;
  const fn=ACTIONS[el.dataset.action];
  if(fn)fn(el.dataset,el);
});
document.addEventListener('submit',e=>{
  const f=e.target.closest('[data-form]');
  if(!f)return;
  e.preventDefault();
  const fn=FORMS[f.dataset.form];
  if(fn)fn(f,f.dataset);
});
document.addEventListener('input',e=>{
  const el=e.target.closest('[data-input="picker"]');
  if(!el)return;
  PICK.q=el.value; PICK.kind=el.dataset.kind;
  SKIPANIM=true;
  /* re-render results only, keeping focus: simplest is full render then restore focus */
  const pos=el.selectionStart;
  render();
  const again=document.querySelector('[data-input="picker"][data-kind="'+el.dataset.kind+'"]');
  if(again){ again.focus(); try{again.setSelectionRange(pos,pos);}catch(err){} }
});
document.addEventListener('change',e=>{
  const el=e.target.closest('[data-change="persona"]');
  if(!el)return;
  if(!el.value)return;
  S.me=el.value; goto('home');
});
/* ORCID checksum: ISO 7064 mod 11-2 */
function orcidValid(str){
  const s=String(str).replace(/[^0-9Xx]/g,'').toUpperCase();
  if(!/^\d{15}[\dX]$/.test(s))return false;
  let total=0;
  for(let i=0;i<15;i++)total=(total+ +s[i])*2;
  const res=(12-(total%11))%11;
  return (res===10?'X':String(res))===s[15];
}
/* ============ init ============ */
window.addEventListener('resize',()=>{ applyLayout(); });
document.addEventListener('pointermove',e=>{
  const el=e.target.closest&&e.target.closest('.spot');
  if(!el)return;
  const r=el.getBoundingClientRect();
  el.style.setProperty('--mx',(e.clientX-r.left)+'px');
  el.style.setProperty('--my',(e.clientY-r.top)+'px');
});
load();
render();
setInterval(updateTimers,30000);
</script>
