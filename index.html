<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Randomised Coffee Trial</title>
<style>
:root{
  --bg:#F7F0E1; --card:#FFFCF4; --ink:#1B160E; --line:#1B160E; --muted:#6E655A;
  --orange:#EB5A2D; --yellow:#F7C64B; --purple:#C9B8F2; --blue:#3D52E0; --green:#8FD6AD; --pink:#F5A9C6;
  --accent:#EB5A2D; --accent-ink:#FFFFFF; --accent-soft:#F7C64B;
  --good:#1F6B3B; --good-soft:#BFE8CF; --warn:#B23A12; --warn-soft:#F7D9CB;
  --focus:#3D52E0; --sh:3px 3px 0 var(--line); --shbig:5px 5px 0 var(--line); --r:16px; --bw:2px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#191410; --card:#241E15; --ink:#F4EBDC; --line:#F4EBDC; --muted:#A79A87;
    --orange:#F26B3F; --yellow:#E9B83F; --purple:#A892E0; --blue:#7D8CF0; --green:#74BD93; --pink:#E295B5;
    --accent:#F26B3F; --accent-ink:#1B160E; --accent-soft:#E9B83F;
    --good:#9FE0B8; --good-soft:#2C4434; --warn:#F0A07E; --warn-soft:#45301F;
  }
}
:root[data-theme="dark"]{
  --bg:#191410; --card:#241E15; --ink:#F4EBDC; --line:#F4EBDC; --muted:#A79A87;
  --orange:#F26B3F; --yellow:#E9B83F; --purple:#A892E0; --blue:#7D8CF0; --green:#74BD93; --pink:#E295B5;
  --accent:#F26B3F; --accent-ink:#1B160E; --accent-soft:#E9B83F;
  --good:#9FE0B8; --good-soft:#2C4434; --warn:#F0A07E; --warn-soft:#45301F;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:ui-rounded,-apple-system,'SF Pro Rounded','Arial Rounded MT Bold','Nunito','Segoe UI',system-ui,sans-serif;
  font-size:15px; line-height:1.5;
}
#protoBanner{background:var(--ink); color:var(--bg); text-align:center; font-size:11px; padding:5px 16px; font-weight:700}
#shell{display:flex; flex-direction:column; min-height:calc(100vh - 27px)}
main{flex:1 1 auto; width:100%; max-width:720px; margin:0 auto; padding:8px 16px 110px}
header.app{display:flex; align-items:center; gap:10px; padding:12px 16px; width:100%; max-width:720px; margin:0 auto}
.logo{display:flex; align-items:center; justify-content:center; width:38px; height:38px; border-radius:50%;
  background:var(--orange); color:#fff; border:var(--bw) solid var(--line); box-shadow:var(--sh); flex:0 0 auto}
.logo svg{width:20px; height:20px}
.brand h1{font-size:16px; margin:0; font-weight:800; letter-spacing:-.01em; line-height:1.15}
.weekchip{margin-left:auto; background:var(--yellow); border:var(--bw) solid var(--line); box-shadow:var(--sh);
  border-radius:999px; padding:4px 13px; font-size:12px; white-space:nowrap; font-weight:800}
button.weekchip{cursor:pointer; font-family:inherit; color:var(--ink)}
.statusbar{display:none}
nav.bottom{position:sticky; bottom:0; z-index:30; width:100%; max-width:720px; margin:0 auto;
  background:var(--card); border-top:var(--bw) solid var(--line);
  display:flex; justify-content:space-around; padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
nav.bottom:empty{display:none}
nav.bottom button{background:none; border:none; font-family:inherit; color:var(--muted); font-size:13px; font-weight:700;
  cursor:pointer; padding:9px 14px; border-radius:10px}
nav.bottom button.on{color:var(--ink)}
#topnav{display:none; gap:6px; margin-left:14px}
#topnav button{border:var(--bw) solid transparent; background:none; font-family:inherit; font-size:13px; font-weight:700;
  color:var(--muted); padding:6px 13px; border-radius:999px; cursor:pointer}
#topnav button:hover{color:var(--ink)}
#topnav button.on{background:var(--card); color:var(--ink); border-color:var(--line); box-shadow:var(--sh)}
html[data-layout="desktop"] nav.bottom{display:none}
html[data-layout="desktop"] #topnav{display:flex}
html[data-layout="desktop"] header.app{max-width:1000px; padding:14px 28px}
html[data-layout="desktop"] main{max-width:1000px; padding:10px 28px 100px}
html[data-layout="desktop"] .cols{display:grid; grid-template-columns:320px 1fr; gap:22px; align-items:start}
html[data-layout="desktop"] .qawrap{display:grid; grid-template-columns:1fr 1fr; gap:14px}
html[data-layout="desktop"] .qawrap .qa{margin:14px 0 0}
html.wide[data-layout="mobile"] body{background:var(--bg)}
html.wide[data-layout="mobile"] #framewrap{display:flex; justify-content:center; padding:26px 12px 90px}
html.wide[data-layout="mobile"] #shell{width:calc(var(--phw,390px) + 4px); height:min(var(--phh,844px),calc(100vh - 150px)); min-height:480px;
  background:var(--bg); border:10px solid #16130d; border-radius:48px; overflow:hidden;
  box-shadow:0 34px 90px rgba(27,22,14,.4); position:relative}
html.wide[data-layout="mobile"] main{overflow-y:auto; min-height:0; padding-bottom:40px}
html.wide[data-layout="mobile"] nav.bottom{position:static}
html.wide[data-layout="mobile"] .statusbar{display:flex; justify-content:space-between; align-items:center;
  padding:12px 26px 0; font-size:13px; font-weight:800}
.sbicons{display:flex; gap:5px; align-items:center}
.sbicons i{display:block; background:var(--ink)}
.sbicons i:nth-child(1){width:15px; height:9px; border-radius:2px; clip-path:polygon(0 100%,100% 100%,100% 0,75% 25%,0 75%)}
.sbicons i:nth-child(2){width:20px; height:10px; border-radius:3px}
*{scrollbar-width:none}
*::-webkit-scrollbar{width:0;height:0;display:none}
html.wlock,html.wlock body{overflow:hidden; overscroll-behavior:none; height:100%}
html.wlock main{overflow:hidden !important; touch-action:none}
/* ---- typography / helpers ---- */
.pagetitle{font-size:20px; margin:16px 2px 8px; font-weight:800; letter-spacing:-.01em}
.pagetitle.center{text-align:center}
.muted{color:var(--muted); font-size:13px}
.small{font-size:12px}
.center{text-align:center}
.footer{color:var(--muted); font-size:11px; text-align:center; margin:30px 0 10px}
hr.soft{border:none; border-top:var(--bw) dashed var(--line); opacity:.35; margin:14px 0}
details{margin:10px 0}
details summary{cursor:pointer; font-weight:800; font-size:13px}
.sectlabel{font-size:11px; color:var(--ink); text-transform:uppercase; letter-spacing:.08em; margin:12px 2px 6px; font-weight:800}
/* ---- cards ---- */
.card{background:var(--card); border:var(--bw) solid var(--line); border-radius:18px;
  padding:16px; margin:14px 0; box-shadow:var(--sh)}
.card h2{margin:0 0 6px; font-size:17px; font-weight:800; letter-spacing:-.01em}
.card h3{margin:14px 0 6px; font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.07em}
.card p{margin:6px 0}
.notice{background:var(--card); border:var(--bw) dashed var(--line); border-radius:14px; padding:10px 13px; font-size:13px; margin:10px 0}
.notice.good{background:var(--good-soft); border-style:solid}
.notice.warn{background:var(--warn-soft); border-style:solid}
.darkcard{background:var(--ink); color:var(--bg); border-radius:18px; padding:16px; margin:14px 0; border:var(--bw) solid var(--line)}
.darkcard h2{color:var(--bg); margin:0 0 6px; font-size:17px; font-weight:800}
.darkcard .muted{color:color-mix(in srgb,var(--bg) 70%,transparent)}
.ruletag{display:inline-block; border:var(--bw) solid var(--bg); border-radius:999px; padding:2px 10px;
  font-size:11px; font-weight:700; margin:3px 4px 0 0; color:var(--bg)}
.ruletag.ok{background:var(--green); color:var(--ink); border-color:var(--ink)}
/* ---- buttons / inputs ---- */
.btn{display:inline-block; border:var(--bw) solid var(--line); background:var(--card); color:var(--ink);
  border-radius:999px; padding:9px 18px; font-size:14px; cursor:pointer; font-weight:800; font-family:inherit;
  margin:4px 6px 4px 0; box-shadow:var(--sh); transition:transform .1s ease, box-shadow .1s ease}
.btn:hover{transform:translate(-1px,-1px); box-shadow:4px 4px 0 var(--line)}
.btn:active{transform:translate(2px,2px); box-shadow:1px 1px 0 var(--line)}
.btn.primary{background:var(--yellow); color:var(--ink)}
.btn.dark{background:var(--ink); color:var(--bg)}
.btn.orange{background:var(--orange); color:#fff}
.btn.small{padding:5px 13px; font-size:12px}
.btn.danger{background:var(--warn-soft); color:var(--warn)}
.btn[disabled]{opacity:.5; cursor:not-allowed}
.linkbtn{background:none; border:none; color:var(--muted); font-size:12px; font-weight:700; cursor:pointer;
  font-family:inherit; text-decoration:underline; padding:4px 2px; margin:2px 8px 2px 0}
.btn:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,
.linkbtn:focus-visible,.chip:focus-visible,.tchip:focus-visible,.cctile:focus-visible,.fab:focus-visible,.seg button:focus-visible,.daypill:focus-visible{
  outline:3px solid var(--focus); outline-offset:2px}
label.f{display:block; margin:12px 0 4px; font-weight:800; font-size:12px; text-transform:uppercase; letter-spacing:.06em}
label.f .opt{font-weight:600; color:var(--muted); text-transform:none; letter-spacing:0}
input[type=text],input[type=search],input[type=password],select,textarea{
  width:100%; padding:9px 12px; border:var(--bw) solid var(--line); border-radius:12px;
  background:var(--card); color:var(--ink); font-family:inherit; font-size:14px}
textarea{min-height:64px; resize:vertical}
/* ---- chips / tags ---- */
.chips{display:flex; flex-wrap:wrap; gap:7px; margin:8px 0}
.chip{background:var(--card); border:var(--bw) solid var(--line); border-radius:999px;
  padding:5px 13px; font-size:12px; font-weight:700; cursor:pointer; font-family:inherit; color:var(--ink); box-shadow:var(--sh)}
.chip:hover{transform:translate(-1px,-1px)}
.chip.on{background:var(--ink); color:var(--bg)}
.tag{display:inline-block; background:var(--purple); border:var(--bw) solid var(--line);
  border-radius:999px; padding:2px 10px; font-size:11px; font-weight:700; margin:2px 4px 2px 0}
.tier{display:inline-block; border:var(--bw) solid var(--line); border-radius:999px; padding:2px 11px; font-size:12px; font-weight:800}
.tier.mutual{background:var(--green)}
.tier.wild{background:var(--yellow)}
.badge{display:inline-block; background:var(--orange); color:#fff; border:var(--bw) solid var(--line);
  border-radius:999px; font-size:11px; font-weight:800; padding:1px 7px; margin-left:6px; vertical-align:1px}
/* ---- topic chips (picker cloud) ---- */
.tcloud{display:flex; flex-wrap:wrap; gap:9px; justify-content:center; margin:12px 0}
.tchip{display:inline-flex; flex-direction:column; align-items:flex-start; gap:1px;
  background:var(--card); border:var(--bw) solid var(--line); border-radius:14px; padding:7px 12px;
  font-family:inherit; color:var(--ink); cursor:pointer; text-align:left; box-shadow:var(--sh);
  transition:transform .1s ease}
.tchip:hover{transform:translate(-1px,-1px)}
.tchip:active{transform:translate(1px,1px)}
.tchip .tcat{display:flex; align-items:center; gap:4px; font-size:8.5px; font-weight:800; letter-spacing:.07em;
  text-transform:uppercase; color:var(--muted)}
.tchip .tcat i{width:7px; height:7px; border-radius:50%; border:1.5px solid var(--line); background:var(--tc,var(--yellow)); display:inline-block}
.tchip .tname{font-size:13px; font-weight:800}
.tchip .tk{display:none; font-size:11px; font-weight:800}
.tchip.on{background:var(--tc,var(--yellow))}
.tchip.on .tcat{color:var(--ink)}
.tchip.on .tk{display:inline; margin-left:4px}
.topicwrap{text-align:center}
/* ---- countdown ---- */
.countdown{display:flex; gap:12px; justify-content:center; margin:12px 0}
.countdown .tcell{text-align:center; min-width:80px; background:var(--ink); color:var(--bg);
  border:var(--bw) solid var(--line); border-radius:16px; padding:12px 8px}
.countdown .tcell:nth-child(1){box-shadow:4px 4px 0 var(--orange)}
.countdown .tcell:nth-child(2){box-shadow:4px 4px 0 var(--yellow)}
.countdown .tcell:nth-child(3){box-shadow:4px 4px 0 var(--purple)}
.countdown .n{font-size:28px; font-weight:800; font-variant-numeric:tabular-nums}
.countdown .l{font-size:9px; color:color-mix(in srgb,var(--bg) 70%,transparent); text-transform:uppercase; letter-spacing:.09em; font-weight:800}
.odo{display:inline-flex}
.odigit{display:inline-block; height:1em; line-height:1; overflow:hidden}
.ostack{display:block; transition:transform .8s cubic-bezier(.25,1.2,.35,1)}
.ostack b{display:block; height:1em; line-height:1; font-weight:inherit}
/* ---- welcome ---- */
.bigtitle{font-size:40px; line-height:1.08; font-weight:800; letter-spacing:-.02em; margin:18px 0 10px}
.titlehl{display:inline-block; background:var(--orange); color:#fff; border:var(--bw) solid var(--line);
  border-radius:14px; padding:0 10px; box-shadow:var(--sh); transform:rotate(-1.5deg)}
.illus{border:var(--bw) solid var(--line); border-radius:18px; box-shadow:var(--shbig); overflow:hidden; margin:16px 0; background:var(--purple)}
html[data-layout="desktop"] #wintro .illus{width:520px; max-width:100%; margin-left:auto; margin-right:auto}
.illus svg{display:block; width:100%; height:auto}
.how2{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:12px 0}
.how2 div{border:var(--bw) solid var(--line); border-radius:16px; padding:14px; font-weight:800; font-size:14px;
  box-shadow:var(--sh); min-height:88px}
.how2 .c1{background:var(--yellow)} .how2 .c2{background:var(--purple)}
.how2 .c3{background:var(--green)} .how2 .c4{background:var(--orange); color:#fff}
.how2 .hnum,.howcard .hnum{display:inline-flex; width:24px; height:24px; border-radius:50%; background:var(--card); color:var(--ink);
  border:var(--bw) solid var(--line); align-items:center; justify-content:center; font-size:12px; margin-bottom:8px}
.brandnew{display:inline-block; background:var(--card); border:var(--bw) solid var(--line); border-radius:999px;
  padding:1px 10px; font-size:10px; font-weight:800; letter-spacing:.07em; margin-bottom:6px}
/* ---- blue match-reveal hero ---- */
.bluehero{position:relative; background:var(--blue); border:var(--bw) solid var(--line); border-radius:20px;
  padding:20px 16px 22px; margin:14px 0; box-shadow:var(--shbig); overflow:hidden}
.bluehero .pagetitle{color:#fff; margin:4px 0 14px; position:relative; z-index:2}
.bluehero .deco{position:absolute; inset:0; pointer-events:none; z-index:1}
.revealcard{position:relative; z-index:2; background:var(--card); border:var(--bw) solid var(--line);
  border-radius:18px; padding:18px 16px; text-align:center; box-shadow:var(--sh)}
.revealcard .dashes{border-top:var(--bw) dashed var(--line); opacity:.5; margin:12px 20px}
.bluehero .btn.ghost{background:transparent; color:#fff; border-color:#fff; box-shadow:3px 3px 0 rgba(0,0,0,.4)}
/* ---- profile ---- */
.orcbadge{display:inline-flex; align-items:center; justify-content:center; width:16px; height:16px;
  border-radius:50%; background:#A6CE39; color:#fff; font-size:8px; font-weight:800;
  border:1.5px solid var(--line); vertical-align:-3px; margin-right:2px}
.pcard{background:var(--purple); border:var(--bw) solid var(--line); border-radius:18px; overflow:hidden;
  margin:14px 0; box-shadow:var(--sh)}
.pcover{display:none}
.avatar{width:64px; height:64px; border-radius:50%; background:var(--orange); color:#fff;
  display:flex; align-items:center; justify-content:center; font-size:26px; font-weight:800;
  border:var(--bw) solid var(--line); margin:14px 0 0 16px; position:relative}
.avatar.big{width:84px; height:84px; font-size:34px; margin:0 0 10px}
.phead{padding:4px 16px 14px}
.phead h2{margin:4px 0 0; font-size:19px; font-weight:800}
.qawrap{margin:4px 0}
.qa{margin:18px 0 0; background:var(--card); border:var(--bw) solid var(--line);
  border-radius:14px; padding:16px 14px 11px; box-shadow:var(--sh); position:relative}
.qa .q{position:absolute; top:-11px; left:12px; background:var(--qc,var(--yellow));
  border:var(--bw) solid var(--line); border-radius:999px; padding:1px 9px;
  font-size:9px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; white-space:nowrap;
  max-width:calc(100% - 24px); overflow:hidden; text-overflow:ellipsis}
.qa .a{font-size:14px; font-weight:600}
.qawrap .qa:nth-child(5n+1){--qc:var(--yellow)}
.qawrap .qa:nth-child(5n+2){--qc:var(--pink)}
.qawrap .qa:nth-child(5n+3){--qc:var(--orange)}
.qawrap .qa:nth-child(5n+4){--qc:var(--green)}
.qawrap .qa:nth-child(5n+5){--qc:var(--purple)}
.card .qa{box-shadow:none}
.proftools{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:8px 0 12px}
.proftools .listlink{margin:0}
.proftools .listlink b{color:var(--ink)}
.proftools .chev{margin-left:auto; font-size:20px; line-height:1}
@media (max-width:380px){ .proftools{grid-template-columns:1fr} }
/* ---- spotlight (kept subtle) ---- */
.spot{position:relative; overflow:hidden}
.spot::after{content:''; position:absolute; inset:0; opacity:0; transition:opacity .25s; pointer-events:none;
  background:radial-gradient(150px circle at var(--mx,50%) var(--my,50%), rgba(255,255,255,.35), transparent 70%)}
.spot:hover::after{opacity:1}
/* ---- list rows ---- */
.listlink{display:flex; align-items:center; gap:12px; width:100%; text-align:left;
  background:var(--card); border:var(--bw) solid var(--line); border-radius:14px;
  padding:13px 14px; margin:10px 0; font-family:inherit; font-size:14px; color:var(--ink); cursor:pointer;
  box-shadow:var(--sh); transition:transform .1s ease}
.listlink:hover{transform:translate(-1px,-1px)}
.listlink .d{color:var(--muted); font-size:12px; display:block; font-weight:600}
.listlink b{font-weight:800}
/* ---- chat / slots ---- */
.chatcard{padding:0; overflow:hidden}
.darkhead{background:var(--ink); color:var(--bg); font-weight:800; font-size:16px; padding:12px 16px;
  border-bottom:var(--bw) solid var(--line)}
.chatbody{padding:12px 16px 16px}
.msg{max-width:85%; padding:8px 12px; border-radius:14px; margin:6px 0; font-size:13px; font-weight:600;
  border:var(--bw) solid var(--line)}
.msg.me{background:var(--yellow); margin-left:auto; border-bottom-right-radius:4px}
.msg.them{background:var(--card); border-bottom-left-radius:4px}
.msg .who{font-size:10px; opacity:.7; display:block; font-weight:800}
.chatbox{display:flex; gap:8px; margin-top:10px}
.chatbox input{flex:1}
.slot{display:flex; align-items:center; gap:8px; background:var(--card); border:var(--bw) solid var(--line);
  border-radius:14px; padding:9px 12px; margin:8px 0; font-size:13px; font-weight:700; box-shadow:var(--sh)}
.slot .btn{margin:0 0 0 auto}
.slot.chosen{background:var(--green)}
/* ---- docked chat input + overlays ---- */
.chatcard.docked{position:fixed; left:0; right:0; top:0; bottom:0; z-index:30; margin:0;
  display:flex; flex-direction:column; border:none; border-radius:0; box-shadow:none; animation:none !important}
.chatcard.docked .darkhead{flex:0 0 auto; display:flex; align-items:center; gap:10px}
.hback{background:none; border:none; color:var(--bg); font-family:inherit; font-weight:800; font-size:18px;
  cursor:pointer; padding:0 4px 0 0; line-height:1}
.chatcard.docked .chatbody{flex:1 1 auto; min-height:0; overflow-y:auto; scrollbar-width:none; padding-bottom:10px}
.chatcard.docked .safebanner{margin:2px 0 12px}
.chatcard.docked .chatbox{position:static; flex:0 0 auto; margin:8px 12px calc(12px + env(safe-area-inset-bottom,0px));
  background:var(--card); border:var(--bw) solid var(--line); border-radius:999px;
  padding:5px 6px; box-shadow:var(--shbig); transition:transform .2s ease}
.chatcard.docked .chatbox input{border:none; background:none; box-shadow:none}
html.wide[data-layout="mobile"] .chatcard.docked{position:absolute}
html.wide[data-layout="mobile"] .chatcard.docked .chatbox{margin:8px 10px 12px}
html[data-layout="desktop"] .chatcard.docked{left:50%; right:auto; transform:translateX(-50%); width:min(680px,92vw);
  border:var(--bw) solid var(--line); border-bottom:none; border-radius:22px 22px 0 0}
.ovl{position:fixed; inset:0; z-index:52; background:rgba(27,22,14,.45);
  display:flex; align-items:flex-end; justify-content:center}
html.wide[data-layout="mobile"] .ovl{position:absolute}
.ovlcard{background:var(--bg); border:var(--bw) solid var(--line); border-bottom:none;
  border-radius:22px 22px 0 0; width:100%; max-width:720px; max-height:84%; overflow-y:auto;
  padding:6px 14px 18px}
.ovlcard .card{border:none; box-shadow:none; margin:4px 0; padding:8px 2px; background:none}
.ovlhead{display:flex; justify-content:flex-end; padding:4px 0 0}
@keyframes sheetUp{from{transform:translateY(46px); opacity:0} to{transform:none; opacity:1}}
@keyframes sheetDown{to{transform:translateY(46px); opacity:0}}
@keyframes ovlOut{to{opacity:0}}
.ovl.closing{animation:ovlOut .19s ease both}
.ovl.closing .ovlcard{animation:sheetDown .19s ease both}
.ovlcard{scrollbar-width:none}
.ovlcard::-webkit-scrollbar,.chatcard.docked .chatbody::-webkit-scrollbar{display:none}
html[data-layout="desktop"] .ovl{align-items:center; padding:24px}
html[data-layout="desktop"] .ovlcard{border-radius:22px; border-bottom:var(--bw) solid var(--line)}
@keyframes msgIn{from{opacity:0; transform:translateY(16px) scale(.9)}}
.msg.anim-in{animation:msgIn .28s cubic-bezier(.2,.8,.25,1)}
#app.noanim > :not(.ovl){animation:none !important}
#app.noanim > :not(.ovl) *:not(.anim-in){animation:none !important}
/* ---- v22: rounded chat header, ghost base, cov hero title, no-anim backdrop ---- */
.chatcard .darkhead{margin:10px 10px 0; border-radius:14px; border:var(--bw) solid var(--line)}
.btn.ghost{background:transparent; color:var(--ink); border-color:var(--line)}
.bluehero.cov-pink .pagetitle,.bluehero.cov-green .pagetitle{color:var(--ink)}
#app>.ovl{animation:none !important}
/* ---- v21: pinned overlay chat, sched days/time, covers, photos, hero fit ---- */
.ovlcard.chatovl{height:84%; display:flex; flex-direction:column; overflow:hidden}
.ovlcard.chatovl .chatcard{flex:1 1 auto; min-height:0; display:flex; flex-direction:column; overflow:hidden; margin:4px 0}
.ovlcard.chatovl .chatbody{flex:1 1 auto; min-height:0; overflow-y:auto; scrollbar-width:none}
.ovlcard.chatovl .chatbody::-webkit-scrollbar{display:none}
.ovlcard.chatovl .chatbox{flex:0 0 auto; margin-top:8px}
.ditem.off{opacity:.35; pointer-events:none}
.timerow{display:flex; gap:8px; align-items:center}
.timerow select{flex:1 1 auto; width:auto; min-width:0; margin:0}
.timerow .tcolon{font-weight:800}
.avatar img{width:100%; height:100%; object-fit:cover; border-radius:50%; display:block}
.cov-blue{background:var(--blue)}
.cov-pink{background:var(--pink)}
.cov-green{background:var(--green)}
.cov-orange{background:var(--orange)}
.pcard.cov-blue,.pcard.cov-orange{color:#fff}
.pcard.cov-blue .muted,.pcard.cov-orange .muted{color:rgba(255,255,255,.78)}
.lookrow{display:flex; gap:9px; align-items:center; padding:0 16px 14px; flex-wrap:wrap; position:relative; z-index:2}
.lookrow .lbl{font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.06em}
.covdot{width:26px; height:26px; border-radius:50%; border:var(--bw) solid var(--line); cursor:pointer; padding:0; box-shadow:var(--sh)}
.covdot.on{outline:3px solid var(--ink); outline-offset:2px}
.lookrow .btn.small{margin:0 0 0 auto}
html[data-layout="mobile"] #app.vcenter{display:flex; flex-direction:column}
html[data-layout="mobile"] #app.vcenter > .herofit{margin:auto 0}
html[data-layout="mobile"] .herofit .bluehero{padding:14px 14px 16px; margin:6px 0}
html[data-layout="mobile"] .herofit .pagetitle{margin:2px 0 10px}
html[data-layout="mobile"] .herofit .revealcard{padding:13px 14px}
html[data-layout="mobile"] .herofit .avatar.big{width:68px; height:68px; font-size:28px}
html[data-layout="mobile"] .herofit .dashes{margin:9px 20px}
/* ---- chat plus menu + schedule bubbles ---- */
.pluswrap{position:relative; flex:0 0 auto}
.plusbtn{width:40px; height:40px; border-radius:50%; border:var(--bw) solid var(--line);
  background:var(--yellow); color:var(--ink); cursor:pointer; box-shadow:var(--sh);
  display:flex; align-items:center; justify-content:center; transition:transform .1s ease}
.plusbtn:active{transform:translate(1px,1px)}
.plusmenu{position:absolute; bottom:48px; left:0; background:var(--card); border:var(--bw) solid var(--line);
  border-radius:14px; box-shadow:var(--shbig); z-index:7; min-width:210px; overflow:hidden;
  animation:ccIn .18s ease both}
.plusmenu button{display:block; width:100%; text-align:left; padding:11px 14px; border:none; background:none;
  font-family:inherit; font-weight:800; font-size:13px; color:var(--ink); cursor:pointer}
.plusmenu button+button{border-top:1.5px solid color-mix(in srgb,var(--line) 25%,transparent)}
.plusmenu button:hover{background:var(--yellow)}
.schedmsg{display:flex; gap:10px; align-items:flex-start; max-width:88%; padding:10px 12px; margin:8px 0;
  border:var(--bw) solid var(--line); border-radius:14px; background:var(--purple); box-shadow:var(--sh); font-size:13px; font-weight:700}
.schedmsg.me{margin-left:auto; border-bottom-right-radius:4px}
.schedmsg.them{border-bottom-left-radius:4px}
.schedmsg svg{flex:0 0 auto; margin-top:2px}
.schedstat{font-size:11px; font-weight:800; color:var(--muted); margin-top:3px}
.schedstat.ok{color:var(--good)}
/* ---- chat reactions + receipts ---- */
.msg{position:relative}
.rbadge{position:absolute; top:-12px; right:-8px; background:var(--card); border:var(--bw) solid var(--line);
  border-radius:999px; padding:2px 6px; display:flex; gap:3px; align-items:center; box-shadow:var(--sh); color:var(--ink)}
.msg.them .rbadge{right:auto; left:-8px}
.rpick{position:absolute; top:-46px; right:0; background:var(--card); border:var(--bw) solid var(--line);
  border-radius:999px; padding:4px 7px; display:flex; gap:4px; box-shadow:var(--shbig); z-index:6;
  animation:ccIn .18s ease both}
.msg.them .rpick{right:auto; left:0}
.rpick button{border:none; background:none; cursor:pointer; padding:4px; border-radius:50%; color:var(--ink); display:flex; font-family:inherit}
.rpick button:hover{background:var(--yellow)}
.receipt{text-align:right; font-size:10px; font-weight:800; color:var(--muted); margin:2px 2px 4px}
#msgs{overflow:visible}
/* ---- plan pills ---- */
.safebanner{display:flex; align-items:center; gap:10px; background:var(--green); border:var(--bw) solid var(--line);
  border-radius:16px; padding:11px 14px; margin:14px 0; font-size:13px; font-weight:700; box-shadow:var(--sh)}
.safebanner svg{flex:0 0 auto}
.planhead .with{color:var(--muted); font-weight:700; font-size:13px; margin-top:-4px}
.pillgrp{display:flex; flex-wrap:wrap; gap:7px; margin:6px 0 2px}
.daypill{border:var(--bw) solid var(--line); background:var(--card); color:var(--ink); border-radius:999px;
  padding:5px 11px; font-size:12px; font-weight:800; font-family:inherit; cursor:pointer; box-shadow:var(--sh)}
.daypill.on{background:var(--ink); color:var(--bg)}
.daypill.day{padding:5px 9px}
.sumpill{display:inline-block; background:var(--yellow); border:var(--bw) solid var(--line); border-radius:14px;
  padding:9px 14px; font-size:13px; font-weight:800; margin:14px 0 4px; box-shadow:var(--sh)}
/* ---- onboarding: auth, location, intro ---- */
.loctile{display:block; width:100%; text-align:left; background:var(--card); border:var(--bw) solid var(--line);
  border-radius:14px; padding:12px 14px; margin:8px 0; font-family:inherit; color:var(--ink); cursor:pointer;
  box-shadow:var(--sh); font-weight:800; font-size:14px}
.loctile .d{display:block; font-size:12px; color:var(--muted); font-weight:600; margin-top:2px}
.loctile.on{background:var(--green)}
.oauthrow{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:8px 0}
.oauthrow .btn{margin:0; display:flex; align-items:center; justify-content:center; gap:8px; font-size:13px}
.radmap{border:var(--bw) solid var(--line); border-radius:14px; overflow:hidden; margin:10px 0; box-shadow:var(--sh)}
.radmap svg{display:block}
input[type=range]{width:100%; accent-color:var(--orange); margin:8px 0 2px}
.popin{opacity:0; animation:popIn .55s cubic-bezier(.3,1.35,.4,1) forwards}
#wintro{min-height:calc(100vh - 230px); display:grid; grid-template-rows:1fr auto 1fr; align-items:center}
#wintro>.popin:first-child{align-self:end}
#wintro>.popin:last-child{align-self:start}
html[data-layout="mobile"]:not(.wide) #wintro{min-height:calc(100dvh - 128px); padding-bottom:88px}
#wrest.show{display:block; animation:none}
.wstep{min-height:calc(100vh - 240px); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:16px}
html.wide[data-layout="mobile"] .wstep{min-height:460px}
.wstep .howcard{max-width:420px}
.wstep .notice,.wstep .darkcard{max-width:460px; text-align:left}
.wdots{display:flex; gap:7px; justify-content:center}
.wdots span{width:9px; height:9px; border-radius:50%; border:var(--bw) solid var(--line); background:var(--card)}
.wdots span.on{background:var(--ink)}
.xhint2{font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.07em; color:var(--muted);
  animation:hintBob 1.6s ease-in-out infinite}
@keyframes hintBob{0%,100%{transform:translateY(0)} 50%{transform:translateY(5px)}}
#app>#wintro,#app>#wrest{animation:none !important}
.srev{opacity:0; transform:translateY(26px); transition:opacity .75s ease, transform .75s ease}
.srev.in{opacity:1; transform:none}
.howrow{min-height:42vh; display:flex; align-items:center}
html.wide[data-layout="mobile"] .howrow{min-height:300px}
.howcard{width:100%; border:var(--bw) solid var(--line); border-radius:16px; padding:24px 18px;
  font-weight:800; font-size:16px; box-shadow:var(--shbig)}
.howcard.c1{background:var(--yellow)} .howcard.c2{background:var(--purple)}
.howcard.c3{background:var(--green)} .howcard.c4{background:var(--orange); color:#fff}
@keyframes fadeUpSlow{from{opacity:0; transform:translateY(16px)} to{opacity:1; transform:none}}
html.wide[data-layout="mobile"] #wintro{min-height:calc(min(var(--phh,844px),100vh - 150px) - 188px); padding-bottom:70px}
html.wide[data-layout="mobile"] #wrest.show{min-height:480px}
@keyframes popIn{from{opacity:0; transform:translateY(16px) scale(.96)} to{opacity:1; transform:none}}
#app.introing>*{animation:none}
@media (prefers-reduced-motion: reduce){ .popin{animation:none; opacity:1} .srev{transition:none; opacity:1; transform:none} }
/* ---- propose stepper ---- */
.dstrip{display:flex; gap:10px; overflow-x:auto; padding:4px 2px 12px; scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch; scrollbar-width:none}
.dstrip::-webkit-scrollbar{display:none}
.ditem{flex:0 0 calc((100% - 30px)/4.3); scroll-snap-align:start; background:none; border:none;
  font-family:inherit; cursor:pointer; text-align:center; padding:0; color:var(--ink)}
.dname{display:block; font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.06em;
  color:var(--muted); margin-bottom:6px}
.dcirc{display:flex; align-items:center; justify-content:center; width:54px; height:54px; margin:0 auto;
  border-radius:50%; border:var(--bw) solid var(--line); background:var(--card); box-shadow:var(--sh);
  font-size:17px; font-weight:800}
.ditem:hover .dcirc{transform:translate(-1px,-1px)}
.ditem.on .dcirc{background:var(--ink); color:var(--bg)}
.ditem.on .dname{color:var(--ink)}
.pchip{background:var(--yellow)}
.step{font-size:11px; font-weight:800; color:var(--muted); text-transform:uppercase; letter-spacing:.07em;
  margin-top:10px; text-align:right}
html[data-layout="desktop"] .dstrip{overflow-x:visible; justify-content:center; gap:10px}
html[data-layout="desktop"] .ditem{flex:0 0 64px}
/* ---- cafe recommendations ---- */
.caferow{display:block; width:100%; text-align:left; background:var(--card); border:var(--bw) solid var(--line);
  border-radius:14px; padding:10px 12px; margin:10px 0; font-family:inherit; color:var(--ink); cursor:pointer;
  box-shadow:var(--sh); transition:transform .1s ease}
.caferow:hover{transform:translate(-1px,-1px)}
.caferow:active{transform:translate(1px,1px)}
.caferow.on{background:var(--green)}
.caferow{display:flex; justify-content:space-between; align-items:center; gap:12px; position:relative; overflow:visible}
.cbadge{position:absolute; top:-10px; right:-8px; width:26px; height:26px; border-radius:50%;
  background:var(--purple); border:var(--bw) solid var(--line); box-shadow:var(--sh);
  display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; z-index:2}
.cafeleft{display:flex; flex-direction:column; gap:2px; min-width:0}
.cafeleft b{font-size:14px; font-weight:800}
.cstars{display:flex; flex-direction:column; gap:3px; flex:0 0 auto}
.ccat{display:flex; justify-content:flex-end; gap:8px; font-size:9.5px; font-weight:800;
  text-transform:uppercase; letter-spacing:.05em; color:var(--muted)}
.ccat .cs{color:var(--orange); letter-spacing:1px; white-space:nowrap}
.ccat .cs b{color:var(--ink); letter-spacing:0}
/* ---- stats / sparks ---- */
.statrow{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:12px; margin:12px 0}
.stat{background:var(--card); border:var(--bw) solid var(--line); border-radius:14px; padding:12px; text-align:center; box-shadow:var(--sh)}
.stat .n{font-size:24px; font-weight:800}
.stat .l{font-size:11px; color:var(--muted); font-weight:700}
.spark{border:var(--bw) solid var(--line); border-left:8px solid var(--orange); border-radius:12px;
  background:var(--card); padding:8px 12px; margin:12px 0; box-shadow:var(--sh)}
.spark .meta{font-size:11px; color:var(--muted); font-weight:700}
.spark .t{font-size:14px; font-style:italic; font-weight:600}
/* ---- misc ---- */
.steps{display:flex; gap:6px; margin:6px 0 14px}
.steps span{flex:1; height:8px; border-radius:4px; background:var(--card); border:var(--bw) solid var(--line)}
.steps span.on{background:var(--orange)}
.orcidbox{border:var(--bw) solid var(--line); border-radius:16px; padding:14px; margin:10px 0; background:var(--card); box-shadow:var(--sh)}
.orcidbox .obh{font-weight:800; font-size:13px; margin-bottom:6px}
.searchres{border:var(--bw) solid var(--line); border-radius:14px; margin-top:8px; overflow:hidden; background:var(--card); box-shadow:var(--sh)}
.searchres .grp{background:var(--bg); padding:5px 12px; font-size:10px; color:var(--muted); font-weight:800; text-transform:uppercase; letter-spacing:.06em}
.searchres button{display:block; width:100%; text-align:left; background:var(--card); color:var(--ink);
  border:none; border-top:1px solid color-mix(in srgb,var(--line) 25%,transparent); padding:9px 12px; font-size:13px; font-weight:700; font-family:inherit; cursor:pointer}
.searchres button:hover{background:var(--yellow)}
.diag{font-size:12px}
.diag table{width:100%; border-collapse:collapse; margin:8px 0}
.diag td,.diag th{border-bottom:1px solid color-mix(in srgb,var(--line) 30%,transparent); padding:5px 6px; text-align:left; vertical-align:top}
.toastwrap{position:fixed; bottom:100px; left:0; right:0; display:flex; justify-content:center; z-index:70; pointer-events:none}
.toast{background:var(--ink); color:var(--bg); border:var(--bw) solid var(--bg); outline:var(--bw) solid var(--ink);
  border-radius:12px; padding:8px 16px; font-size:13px; font-weight:800; animation:ccIn .22s ease both}
.safetyscreen{display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; gap:8px; height:calc(100vh - 185px); padding:0 10px}
html.wide[data-layout="mobile"] .safetyscreen{height:100%}
body.lock{overflow:hidden}
body.lock main{overflow:hidden !important}
.xbig{font-size:17px; max-width:34em; margin:0; font-weight:700}
.cols{display:block}
/* ---- staggered side menu ---- */
#menuBtn{border:none; background:none; cursor:pointer; padding:9px 8px; margin-right:2px;
  display:flex; flex-direction:column; gap:5px; z-index:56; position:relative}
#menuBtn i{display:block; width:20px; height:3px; background:var(--ink); border-radius:2px;
  transition:transform .3s cubic-bezier(.2,.8,.25,1), opacity .25s}
#menuBtn.x i:nth-child(1){transform:translateY(8px) rotate(45deg)}
#menuBtn.x i:nth-child(2){opacity:0}
#menuBtn.x i:nth-child(3){transform:translateY(-8px) rotate(-45deg)}
.smenu{position:fixed; inset:0; z-index:55}
html.wide[data-layout="mobile"] .smenu{position:absolute}
.sback{position:absolute; inset:0; background:rgba(27,22,14,0); transition:background .4s}
.smenu.open .sback{background:rgba(27,22,14,.4)}
.spanel{position:absolute; top:0; bottom:0; left:0; width:min(320px,82%);
  transform:translateX(-103%); transition:transform .5s cubic-bezier(.2,.8,.25,1);
  background:var(--card); border-right:var(--bw) solid var(--line);
  padding:74px 28px 20px; display:flex; flex-direction:column; overflow:hidden}
.smenu.open .spanel{transform:none}
.slayer{position:absolute; inset:0; background:var(--orange); transform:translateX(0);
  transition:transform .55s cubic-bezier(.2,.8,.25,1) .08s; pointer-events:none}
.smenu.open .slayer{transform:translateX(103%)}
.sitems{display:flex; flex-direction:column; align-items:flex-start}
.sitem{display:flex; align-items:baseline; gap:12px; background:none; border:none; font-family:inherit;
  color:var(--ink); font-size:30px; font-weight:800; letter-spacing:-.02em; padding:12px 0; cursor:pointer;
  text-align:left; opacity:0; transform:translateY(26px);
  transition:opacity .45s ease, transform .5s cubic-bezier(.2,.8,.25,1), color .2s}
.smenu.open .sitem{opacity:1; transform:none}
.sitem .snum{font-size:12px; color:var(--orange); font-weight:800}
.sitem.on,.sitem:hover{color:var(--orange)}
.sfoot{margin-top:auto; opacity:0; transition:opacity .5s ease .4s}
.smenu.open .sfoot{opacity:1}
/* ---- control centre ---- */
.fab{position:fixed; right:18px; bottom:18px; z-index:60; height:48px; padding:0 18px 0 14px; gap:8px;
  border-radius:999px; font-family:inherit; font-size:13px; font-weight:800;
  border:var(--bw) solid var(--line); background:var(--yellow); color:var(--ink);
  box-shadow:var(--shbig); cursor:pointer; display:flex; align-items:center; justify-content:center;
  transition:transform .12s ease}
.fab:hover{transform:translate(-1px,-1px)}
.fab:active{transform:translate(2px,2px)}
html[data-layout="mobile"]:not(.wide) .fab{bottom:72px}
.ccpanel{position:fixed; right:18px; bottom:82px; z-index:59; width:350px; max-width:calc(100vw - 24px);
  max-height:calc(100vh - 120px); overflow-y:auto;
  background:var(--card); border:var(--bw) solid var(--line); border-radius:20px;
  box-shadow:var(--shbig); padding:14px; animation:ccIn .25s cubic-bezier(.2,.7,.3,1) both}
html[data-layout="mobile"]:not(.wide) .ccpanel{left:12px; right:12px; width:auto; bottom:134px}
@keyframes ccIn{from{opacity:0; transform:translateY(12px) scale(.97)} to{opacity:1; transform:none}}
.cchead{display:flex; align-items:baseline; gap:8px; margin-bottom:10px}
.cchead b{font-size:14px}
.ccclose{margin-left:auto; border:var(--bw) solid var(--line); background:var(--card); color:var(--ink);
  width:26px; height:26px; border-radius:50%; cursor:pointer; font-size:14px; line-height:1; font-family:inherit; font-weight:800}
.ccstats{display:flex; gap:8px; margin-bottom:10px}
.ccstats>div{flex:1; background:var(--bg); border:var(--bw) solid var(--line); border-radius:12px; padding:8px 10px}
.ccstats b{display:block; font-size:13px}
.ccstats span{display:block; font-size:11px; color:var(--muted); font-weight:700}
.ccgrid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:8px 0}
.cctile{background:var(--bg); border:var(--bw) solid var(--line); border-radius:14px; padding:10px 12px;
  text-align:left; font-family:inherit; color:var(--ink)}
.cctile.wide{margin:8px 0}
.cctile.act{cursor:pointer; box-shadow:var(--sh); transition:transform .1s ease}
.cctile.act:hover{transform:translate(-1px,-1px)}
.cctile.act:active{transform:translate(1px,1px)}
.cctile .ck{display:block; font-weight:800; font-size:13px}
.cctile .cv{display:block; font-size:11px; color:var(--muted); margin-top:1px; font-weight:600}
.cctile.prime{background:var(--yellow)}
.cctile.dim{opacity:.45}
.cctile.dangert .ck{color:var(--warn)}
.cclabel{font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.07em; display:block; margin-bottom:3px; font-weight:800}
.seg{display:flex; background:var(--bg); border:var(--bw) solid var(--line); border-radius:12px; padding:3px; gap:3px; margin:2px 0 8px}
.seg button{flex:1; border:none; background:none; border-radius:8px; padding:5px 0; font-size:12px; font-weight:700;
  font-family:inherit; color:var(--muted); cursor:pointer}
.seg button.on{background:var(--ink); color:var(--bg)}
/* ---- papers folder (React Bits flap port, reskinned) ---- */
.rbscene{perspective:1100px; margin:4px 0 10px}
.rbfolder{position:relative; width:var(--fw); height:calc(var(--fh) + var(--tab));
  margin:calc(var(--dh) + 26px) auto 4px; cursor:pointer; outline-offset:6px;
  transform:rotateX(var(--rtx,0deg)) rotateY(var(--rty,0deg)); transform-style:preserve-3d;
  transition:transform .3s ease}
.rbtab{position:absolute; top:-3px; left:-2px; width:36%; height:calc(var(--tab) + 12px);
  border-radius:10px 10px 0 0; background:var(--orange); border:var(--bw) solid var(--line); z-index:1}
.rbback{position:absolute; left:0; right:0; top:var(--tab); bottom:0; z-index:1;
  border-radius:0 12px 12px 12px; background:var(--orange); border:var(--bw) solid var(--line)}
.rbfront{position:absolute; left:0; right:0; top:calc(var(--tab) + var(--fh)*0.3); bottom:0; z-index:3;
  border-radius:6px 12px 14px 14px; transform-origin:50% 100%; pointer-events:none;
  background:var(--yellow); border:var(--bw) solid var(--line);
  transition:transform .5s cubic-bezier(.34,1.3,.64,1)}
.folderwrap.open .rbfront{transform:perspective(1100px) rotateX(-64deg)}
.folderwrap:not(.open) .rbfolder:hover .rbfront{transform:perspective(1100px) rotateX(-15deg)}
.rbpaper{position:absolute; left:50%; bottom:6px; width:var(--dw); height:var(--dh); z-index:2;
  background:var(--card); border:var(--bw) solid var(--line); border-radius:8px;
  display:flex; flex-direction:column; align-items:center; justify-content:flex-start; gap:4px;

const T_MUTUAL=0.75;
function pairEval(A,B){
  /* hard filters */
  if(isPaused(A)||isPaused(B))return {ok:false,why:'paused'};
  if(!A.verified||!B.verified)return {ok:false,why:'unverified'};
  if(A.matchedBefore.includes(B.id))return {ok:false,why:'already matched before (never re-matched)'};
  if(A.blocked.includes(B.id)||B.blocked.includes(A.id))return {ok:false,why:'blocked'};
  const d=userDist(A,B);
  if(d>A.maxKm||d>B.maxKm)return {ok:false,why:'outside travel range ('+d.toFixed(0)+' km)'};
  const overlap=A.availability.filter(w=>B.availability.includes(w));
  if(overlap.length===0)return {ok:false,why:'no availability overlap'};
  /* scores and tier */
  const sAB=interestScore(A,B), sBA=interestScore(B,A);
  const mutual=sAB>=T_MUTUAL&&sBA>=T_MUTUAL;
  const oneWay=!mutual&&(sAB>=T_MUTUAL||sBA>=T_MUTUAL);
  const tier=mutual?'mutual':oneWay?'oneWay':'open';
  const union=new Set([...A.availability,...B.availability]).size;
  const diffDiv=TOPIC[A.backgroundTopics[0]].div!==TOPIC[B.backgroundTopics[0]].div;
  const tierBase=mutual?1000:oneWay?500:0;
  const topicBonus=40*(sAB+sBA)/2;
  const prox=Math.max(0,15*(1-d/Math.min(A.maxKm,B.maxKm)));
  const avail=10*(overlap.length/union);
  const bridge=(tier==='open'&&diffDiv)?10:0;
  const carry=25*(A.unmatchedLastWeek?1:0)+25*(B.unmatchedLastWeek?1:0);
  const weight=tierBase+topicBonus+prox+avail+bridge+carry;
  return {ok:true,tier,sAB,sBA,d,overlap,weight,parts:{tierBase,topicBonus,prox,avail,bridge,carry}};
}
function matchReason(ev,A,B){
  if(ev.tier==='mutual')return 'You are each curious about the other’s field, you are '+ev.d.toFixed(1)+' km apart, and your weeks overlap.';

  return 'No mutual match existed this week, so we suggest someone nearby from a different corner of research. Everyone has something to share.';

function carTick(ts){
  CAR.raf=null;
  const stage=document.getElementById('carousel');
  if(!stage)return;
  if(!CAR.lastT)CAR.lastT=ts;
  const dt=Math.min(0.05,(ts-CAR.lastT)/1000); CAR.lastT=ts;
  if(CAR.mode==='spring'){
    /* spring: stiffness 118, critical damping, 1/240s substeps */
    const k=118, cd=2*Math.sqrt(k);
    const steps=Math.max(1,Math.round(dt*240)), h=dt/steps;
    for(let z=0;z<steps;z++){
      const x=CAR.angle-CAR.target;
      CAR.vel+=(-k*x-cd*CAR.vel)*h;
      CAR.angle+=CAR.vel*h;
    }
    if(Math.abs(CAR.angle-CAR.target)<0.004&&Math.abs(CAR.vel)<0.03){ CAR.angle=CAR.target; CAR.vel=0; CAR.mode='idle'; }
    applyAngle();
  }else if(CAR.mode!=='drag'){
    /* autoplay drift at 14 deg/s; pauses on hover, drags and holds */
    if(!CAR.hover&&!carReduced()&&Date.now()>CAR.hold){ CAR.angle-=14*dt; applyAngle(); }
  }

}

function h32(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function genOrcid(seed){
  let h=h32(String(seed)); let digits='000';
  for(let i=0;i<12;i++){ h=Math.imul(h,1664525)+1013904223>>>0; digits+=String((h>>>16)%10); }
  let total=0; for(let i=0;i<15;i++) total=(total+ +digits[i])*2;
  const res=(12-(total%11))%11;
  const full=digits+(res===10?'X':String(res));
  return full.slice(0,4)+'-'+full.slice(4,8)+'-'+full.slice(8,12)+'-'+full.slice(12);
}
function cafeRecs(A,B){
  /* simulated Google Places layer: real midpoint distances, deterministic ratings.
     Real version: Places Nearby Search (type=cafe) around the pair midpoint + Place
     Details, with atmosphere/coffee sub-scores derived from review text server-side. */
  const names=['The Hidden Fig','Common Grounds','Little Ember','Marigold & Co','The Long Black','Paper Cup','Sunroom Coffee','The Kindling','Field Notes Espresso','Good Neighbour','The Corner Filter','Husk & Honey'];
  const seed=h32(A.area+'|'+B.area);
  const n=4+(seed%2);
  const out=[];
  for(let i=0;i<n;i++){
    const hh=h32(seed+':'+i);
    const name=names[(seed+i*7)%names.length];
    const dist=0.15+((hh%100)/100)*1.4;
    const rev=3.5+(((hh>>3)%4)*0.5);
    const atm=3.5+(((hh>>5)%4)*0.5);
    const cof=3.5+(((hh>>7)%4)*0.5);
    /* recommended score: proximity weighted highest (meetups actually happening),
       then atmosphere and reviews, then coffee */
    const prox=5-Math.min(1,Math.max(0,(dist-0.15)/1.4))*2;
    const score=0.35*prox+0.25*atm+0.25*rev+0.15*cof;
    out.push({name,dist,rev,atm,cof,score});
  }
  out.sort((a,b)=>b.score-a.score);
  return out.slice(0,5);
}

function nextDayDate(dayName,hourF){
  const days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const target=days.indexOf(dayName); if(target<0)return Date.now()+3*86400000;
  const h=Math.floor(hourF),mi=Math.round((hourF-h)*60);
  const cand=new Date(); cand.setHours(h,mi,0,0);
  let add=(target-cand.getDay()+7)%7;
  if(add===0&&cand.getTime()<=Date.now())add=7;
  cand.setDate(cand.getDate()+add);
  return cand.getTime();
}
function nextMondayMidnight(){
  const d=new Date(); d.setHours(0,0,0,0);
  let add=(1-d.getDay()+7)%7; if(add===0)add=7;
  d.setDate(d.getDate()+add); return d.getTime();
}

const PICK={q:'',kind:null};
function searchTopics(q){
  q=q.trim().toLowerCase(); if(q.length<2)return[];
  const qTokens=q.split(/\s+/);
  const scored=[];
  for(const id in TOPIC){
    const t=TOPIC[id];
    const cands=[t.label.toLowerCase(),...t.syn.map(s=>s.toLowerCase()),t.subLabel.toLowerCase()];
    let best=0;
    for(const c of cands){
      if(c===q)best=Math.max(best,5);
      else if(c.includes(q))best=Math.max(best,4);
      else{
        const cTok=c.split(/\s+/);
        let hit=0;
        for(const qt of qTokens){
          if(cTok.some(ct=>ct.startsWith(qt)))hit+=2;
          else if(qt.length>3&&cTok.some(ct=>lev(qt,ct)<=2))hit+=1;
        }
        best=Math.max(best,hit/qTokens.length);
      }
    }
    if(best>=1)scored.push({id,best});
  }
  scored.sort((a,b)=>b.best-a.best);
  return scored.slice(0,8).map(s=>s.id);
}

}

V.match=function(){
  const u=me(); const m=S.matches.find(x=>x.id===S.sel);
  if(!u||!m)return V.home();
  const p=partnerOf(m,u.id);
  /* past weeks are archived: only the profile and the chat history remain */
  if(m.week<S.week){
    return '<button class="btn small" data-action="goBack">← Back</button>'
     +'<div class="muted small center" style="margin-top:6px">Week '+m.week+' · '+(m.tier==='mutual'?'mutual match':'wildcard')+'</div>'
     +profileCard(p,true)
     +chatCard(m,u,p,true);
  }
  let out='<button class="btn small" data-action="goBack">← Back</button>';
  if(['cancelled','noShow'].includes(m.status)){
    out+='<div class="card"><h2>'+(m.status==='cancelled'?'This match has ended for the week':'This one didn’t happen')+'</h2>'
      +'<p class="muted">No penalty, no fuss. A new match comes with the next weekly drop.</p></div>';
    return out;
  }
  if(m.status==='happened')return '<button class="btn small" data-action="uncompleteMeet" data-m="'+m.id+'">\u2190 Back</button>'+wentWellHtml(m,u,p);
  if(!MSTATE.plan){
    out+=profileCard(p,true)
      +papersHtml(p,false)
      +'<div class="center" style="margin:16px 0 4px"><button class="btn dark" data-action="planCoffee">Plan coffee \u2192</button></div>'
      +'<div class="center" style="margin-top:14px"><button class="linkbtn" data-action="cantMake" data-m="'+m.id+'">Can\u2019t make it this week</button>'
      +'<button class="linkbtn" data-action="blockUser" data-m="'+m.id+'">Block</button>'
      +'<button class="linkbtn" data-action="reportUser" data-m="'+m.id+'">Report</button></div>';
    return out;
  }
  if(m.chosenSlot){
    if(MSTATE.chatOpen){
      out=chatCard(m,u,p,false,true);
      out+=cafeSchedOvl(m,u,p);
      return out;
    }
    out+='<div class="card center"><h2>Meet up organised!</h2>'
      +'<p>'+slotText(m.chosenSlot)+(m.chosenSlot.duration?'':(m.duration?' \u00b7 '+esc(m.duration.toLowerCase()):''))+'</p>'
      +countdownHtml(m.meetAt,'until you meet '+p.displayName)
      +'<button class="btn primary" data-action="openChat">'+(m.messages.length?'Open chat':'Send message')+(!MSTATE.chatOpen&&unreadCount(m,u)>0?' <span class="badge">'+unreadCount(m,u)+'</span>':'')+'</button>'
      +(m.timeChangeBy&&m.timeChangeBy!==u.id?'<div style="margin-top:8px"><button class="btn small orange" data-action="openChat">'+esc(p.displayName)+' has requested to change the scheduled time</button></div>':'')
      +'<div style="margin-top:6px"><button class="btn small" data-action="addToCal" data-m="'+m.id+'">Add to calendar</button></div>'
      +(timeReached(m)?'<div style="margin-top:8px"><button class="btn orange" data-action="completeMeet" data-m="'+m.id+'">Complete \u2192</button></div>':'')
      +'</div>';
    return out;
  }
  m.slotsSeen=m.slotsSeen||{}; m.slotsSeen[u.id]=m.slots.length;
  out=chatCard(m,u,p,false,true);
  out+=cafeSchedOvl(m,u,p);
  return out;
};
function unreadCount(m,u){
  m.seen=m.seen||{};
  return m.messages.slice(m.seen[u.id]||0).filter(x=>x.from!==u.id).length;
}
function unseenSlots(m,u){
  m.slotsSeen=m.slotsSeen||{};
  const seen=m.slotsSeen[u.id]||0;
  return m.slots.slice(seen).filter(x=>x.by!==u.id).length;
}
function matchAlerts(m,u){
  let n=unreadCount(m,u);
  if(m.status==='planning')n+=unseenSlots(m,u);
  return n;
}
const REACT={t:null,open:null,just:0,sx:0,sy:0};
function reactSvg(t,sz){
  const thumb='<path d="M8 11l2.6-5.2A1.8 1.8 0 0 1 14 6.6L13.4 10H17a2 2 0 0 1 2 2.4l-.9 4A2 2 0 0 1 16.1 18H10a2 2 0 0 1-2-2z"/><rect x="4" y="10.5" width="3" height="7.5" rx="1"/>';
  const map={
    up:'<g>'+thumb+'</g>',
    down:'<g transform="rotate(180 12 12)">'+thumb+'</g>',
    heart:'<path d="M12 19.5s-7-4.3-8.8-8.3A4.6 4.6 0 0 1 11.5 7a4.6 4.6 0 0 1 8.3 4.2C18 15.2 12 19.5 12 19.5z"/>',
    laugh:'<circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 13.5a4.2 4.2 0 0 0 8 0z"/><circle cx="9.3" cy="10" r="1.1"/><circle cx="14.7" cy="10" r="1.1"/>'
  };
  return '<svg width="'+sz+'" height="'+sz+'" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">'+(map[t]||'')+'</svg>';
}
function msgReactsHtml(msg){
  const r=msg.r?[...new Set(Object.values(msg.r))]:[];

  return '<span class="rbadge">'+r.map(t=>reactSvg(t,12)).join('')+'</span>';
}
function openReactPicker(mg){
  closeReactPicker();
  const pick=document.createElement('div');

  pick.innerHTML=['up','down','heart','laugh'].map(t=>'<button type="button" data-action="reactSet" data-mi="'+mg.dataset.mi+'" data-t="'+t+'" aria-label="React '+t+'">'+reactSvg(t,18)+'</button>').join('');

function closeReactPicker(){ document.querySelectorAll('.rpick').forEach(x=>x.remove()); REACT.open=null; }
function chatCard(m,u,p,locked,dock){
  m.seen=m.seen||{}; m.seen[u.id]=m.messages.length;
  const closed=locked||m.week<S.week;
  const canSee=(u.readReceipts!==false)&&(p.readReceipts!==false);
  let lastOwn=-1; m.messages.forEach((msg,i)=>{ if(msg.from===u.id)lastOwn=i; });
  let lastPend=-1; m.messages.forEach((msg,i)=>{ if(msg.kind==='sched'&&msg.status==='pending')lastPend=i; });
  const calIco='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>';
  const dk=dock&&!closed;
  let out='<div class="card chatcard'+(dk?' docked':'')+'"><div class="darkhead">'
   +(dk?'<button type="button" class="hback" data-action="goBack" aria-label="Back">\u2190</button>':'')
   +'Chat</div><div class="chatbody">'
   +(dk?'<div class="safebanner"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/><path d="M9 12l2 2 4-4"/></svg><span>Meet in a public place, tell a friend where you\u2019re going, and trust your gut.</span></div>':'');
  out+='<div id="msgs" class="'+(closed?'locked':'')+'">'+m.messages.map((msg,i)=>{
    let b='';
    if(msg.kind==='sched'){
      const mine=msg.from===u.id;
      let status='';
      if(msg.status==='accepted'){
        status='<div class="schedstat ok">\u2713 Accepted</div>'
         +(m.status==='scheduled'&&!closed?'<div><button type="button" class="btn small" data-action="addToCal" data-m="'+m.id+'">Add to calendar</button></div>':'');
      }else if(mine)status='<div class="schedstat">waiting for '+esc(p.displayName)+'</div>';
      else if(!closed&&i===lastPend)status='<div style="margin-top:4px"><button type="button" class="btn small primary" data-action="schedAccept" data-mi="'+i+'">Accept</button></div>';
      b='<div class="schedmsg '+(mine?'me':'them')+'">'+calIco+'<div><b>Coffee</b>'
       +'<div class="small" style="font-weight:700">'+esc(msg.schedLabel||'')+' \u00b7 '+esc(msg.time||'')+' \u00b7 '+esc((msg.duration||'').toLowerCase())+'</div>'
       +status+'</div></div>';
    }else{
      b='<div class="msg '+(msg.from===u.id?'me':'them')+'" data-mi="'+i+'"><span class="who">'+esc(S.users[msg.from]?S.users[msg.from].displayName:msg.from)+'</span>'+esc(msg.text)+msgReactsHtml(msg)+'</div>';
    }
    if(i===lastOwn&&canSee&&!closed)b+='<div class="receipt">'+(((m.seen[p.id]||0)>lastOwn)?'Seen':'Delivered')+'</div>';
    return b;
  }).join('')+'</div>';
  if(closed)out+='<p class="notice small">This chat is closed now the meetup is wrapped up.</p></div>';
  else{
    const cupIco='<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 9.5h12v5.5a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4z"/><path d="M16 10.5h2.3a2.4 2.4 0 0 1 0 4.8H16"/><path d="M7.5 6c0-1 .5-1.2.5-2.2M11 6c0-1 .5-1.2.5-2.2"/></svg>';
    out+='</div><div class="chatbox">'
     +'<div class="pluswrap"><button type="button" class="plusbtn" data-action="chatPlus" aria-label="Coffee options">'+cupIco+'</button>'
     +'<div class="plusmenu" id="plusmenu" style="display:none">'
     +'<button type="button" data-action="menuCafes">Recommended caf\u00e9s</button>'
     +'<button type="button" data-action="menuSched">'+(m.chosenSlot?'Change scheduled coffee time':'Schedule coffee')+'</button>'
     +'</div></div>'
     +'<input type="text" id="chatIn" placeholder="Message\u2026" aria-label="Chat message">'
     +'<button class="btn small primary" data-action="sendMsg" data-m="'+m.id+'">Send</button></div>';
  }
  return out+'</div>';
}
function afterMeetHtml(m,u,p){

V.dashboard=function(){
  const happened=S.matches.filter(m=>m.status==='happened');
  const all=S.matches.filter(m=>['happened','scheduled','planning','noShow','cancelled'].includes(m.status));
  const mut=all.filter(m=>m.tier==='mutual').length;
  const pcMut=all.length?Math.round(100*mut/all.length):0;
  const sv=S.surveys;
  const learned=sv.length?Math.round(100*sv.filter(s=>s.learnedUnexpected>=4).length/sv.length):0;
  /* disciplinary distance: 1 - best similarity between the pair's background topics (aggregate only) */
  let dd=0;
  if(happened.length){
    dd=happened.reduce((acc,m)=>{
      const A=S.users[m.a],B=S.users[m.b]; if(!A||!B)return acc;
      let best=0; A.backgroundTopics.forEach(x=>B.backgroundTopics.forEach(y=>{const s=similarity(x,y); if(s>best)best=s;}));
      return acc+(1-best);
    },0)/happened.length;
  }
  const counts={}; Object.values(S.users).forEach(u=>{const n=S.matches.filter(m=>m.a===u.id||m.b===u.id).length; if(n>1)counts[u.id]=n;});
  const repeat=Object.keys(counts).length;
  const pauses=S.feedback.filter(f=>f.kind==='pause');
  return '<button class="btn small" data-action="goBack">← Back</button>'
   +'<div class="card"><h2>Impact dashboard</h2><p class="muted small">Aggregates only. No individual data, ever. (The sort of numbers a funder would ask for.)</p>'
   +'<div class="statrow">'
   +'<div class="stat"><div class="n">'+happened.length+'</div><div class="l">meetups happened</div></div>'
   +'<div class="stat"><div class="n">'+pcMut+'%</div><div class="l">mutual (vs wildcard)</div></div>'
   +'<div class="stat"><div class="n">'+learned+'%</div><div class="l">learned something unexpected</div></div>'
   +'<div class="stat"><div class="n">'+dd.toFixed(2)+'</div><div class="l">avg disciplinary distance (0–1)</div></div>'
   +'<div class="stat"><div class="n">'+repeat+'</div><div class="l">people with repeat meetups</div></div>'
   +'<div class="stat"><div class="n">'+pauses.length+'</div><div class="l">pauses recorded</div></div>'
   +'</div>'
   +(pauses.length?'<h3>Why people pause</h3><ul class="small">'+pauses.map(p=>'<li>'+esc(p.text||'(no reason given)')+'</li>').join('')+'</ul>':'')
   +'</div>';
};

V.explain=function(){
  const u=me();
  const wk=weekRun(S.week)?S.week:S.runWeeks[S.runWeeks.length-1];
  const d=wk!=null?S.diag[wk]:null;
  let out='<button class="btn small" data-action="goBack">← Back</button>'
   +'<div class="card diag"><h2>How was this decided?</h2>'
   +'<p class="notice warn small"><b>Demo/admin view only.</b> Real users never see this: it exposes other people’s private interests via scores.</p>';
  if(!d){ out+='<p>No matching run yet. Use "Run this week’s matching" in the control centre.</p></div>'; return out; }
  out+='<p class="small">Week '+wk+': '+d.pairs+' pairs made. Mutual pairs (both topic-fit scores ≥ '+T_MUTUAL+') always outrank wildcards (base weight 1000 vs 500 vs 0). Topic fit uses the curated similarity layer, so "chronic pain" and "low back pain" score 0.9. Greedy pairing with a swap pass, not guaranteed optimal.</p>';
  if(d.unmatched.length)out+='<p class="small"><b>Unmatched this week (get carry-over priority):</b> '+d.unmatched.map(id=>esc(S.users[id]?S.users[id].displayName:id)).join(', ')+'</p>';
  if(u&&d.perUser[u.id]){
    const pu=d.perUser[u.id];
    const cands=[...pu.candidates].sort((a,b)=>(b.ev.ok?b.ev.weight:-1)-(a.ev.ok?a.ev.weight:-1));
    out+='<h3>Candidates for '+esc(u.displayName)+'</h3><table><tr><th>Person</th><th>Outcome</th></tr>'
     +cands.map(c=>{
       const o=S.users[c.id]; const name=o?o.displayName:c.id;
       if(!c.ev.ok)return '<tr><td>'+esc(name)+'</td><td>✕ excluded: '+esc(c.ev.why)+'</td></tr>';
       const chosen=pu.matchedWith===c.id;
       const pr=c.ev.parts;
       return '<tr><td>'+esc(name)+(chosen?' <b>← matched</b>':'')+'</td><td>'+c.ev.tier+' · weight '+c.ev.weight.toFixed(1)
        +'<br><span class="muted">fit '+c.ev.sAB.toFixed(2)+' / '+c.ev.sBA.toFixed(2)+' · '+c.ev.d.toFixed(1)+' km · base '+pr.tierBase+' + topics '+pr.topicBonus.toFixed(1)+' + prox '+pr.prox.toFixed(1)+' + avail '+pr.avail.toFixed(1)+' + bridge '+pr.bridge+' + carry '+pr.carry+'</span></td></tr>';
     }).join('')+'</table>';
    if(!pu.matchedWith)out+='<p class="small">'+esc(u.displayName)+' went unmatched: '+(pu.candidates.some(c=>c.ev.ok)?'every eligible candidate was taken by a heavier pair (odd one out).':'no candidate passed the hard filters (range, availability, history, blocks, pause).')+'</p>';
  } else if(u) out+='<p class="small">'+esc(u.displayName)+' was not in that run (paused or added later).</p>';
  out+='</div>';
  return out;
};

const FORMS={

    if(c)c.setAttribute('r',Math.min(82,10+km*1.2).toFixed(0));
    save();
    return;
  }
  const aq=e.target.closest('[data-input="areaq"]');
  if(aq){
    const q=aq.value.trim().toLowerCase();
    const res=document.getElementById('areaRes'); if(!res)return;
    if(!q){ res.style.display='none'; res.innerHTML=''; return; }
    const hits=AREAS.filter(a=>(a.name+' '+a.city).toLowerCase().includes(q)).slice(0,8);
    res.innerHTML=hits.length
      ?hits.map(a=>'<button type="button" data-action="areaPick" data-a="'+a.id+'">'+esc(a.name)+' ('+esc(a.city)+')</button>').join('')
      :'<div class="grp">No matching area</div>';
    res.style.display='';
    return;
  }
  const el=e.target.closest('[data-input="picker"]');
  if(!el)return;
  PICK.q=el.value; PICK.kind=el.dataset.kind;
  SKIPANIM=true;
  /* re-render results only, keeping focus: simplest is full render then restore focus */
  const pos=el.selectionStart;
  render();
  const again=document.querySelector('[data-input="picker"][data-kind="'+el.dataset.kind+'"]');
  if(again){ again.focus(); try{again.setSelectionRange(pos,pos);}catch(err){} }
});
document.addEventListener('change',e=>{
  if(e.target&&e.target.id==='pfile'&&e.target.files&&e.target.files[0]){
    const f=e.target.files[0];
    if(!/^image\//.test(f.type)){ toast('Please choose an image'); return; }
    const rd=new FileReader();
    rd.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const sz=128,c=document.createElement('canvas'); c.width=sz; c.height=sz;
        const x=c.getContext('2d');
        const s=Math.min(img.width,img.height);
        x.drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,sz,sz);
        const u=me(); if(!u)return;
        u.photo=c.toDataURL('image/jpeg',0.82);
        save();
        const av=document.querySelector('.pcard .avatar');
        if(av)av.innerHTML='<img src="'+u.photo+'" alt="">';
        toast('Photo updated');
      };
      img.src=rd.result;
    };
    rd.readAsDataURL(f);
    return;
  }
  const el=e.target.closest('[data-change="persona"]');
  if(!el)return;
  if(!el.value)return;
  S.me=el.value; goto('home');
});
/* ORCID checksum: ISO 7064 mod 11-2 */
function orcidValid(str){
  const s=String(str).replace(/[^0-9Xx]/g,'').toUpperCase();
  if(!/^\d{15}[\dX]$/.test(s))return false;
  let total=0;
  for(let i=0;i<15;i++)total=(total+ +s[i])*2;
  const res=(12-(total%11))%11;
  return (res===10?'X':String(res))===s[15];
}

window.addEventListener('resize',()=>{ applyLayout(); layoutCarousel(); xexpand(); sizeChat(); });
if(window.visualViewport){
  visualViewport.addEventListener('resize',()=>{
    const dk=document.querySelector('.chatcard.docked .chatbox');

document.addEventListener('touchstart',e=>{
  if(welcomeActive()&&e.touches.length===1){ WSW.y=e.touches[0].clientY; WSW.active=true; }
},{passive:true});
document.addEventListener('touchmove',e=>{
  if(welcomeActive())e.preventDefault();
},{passive:false});
document.addEventListener('touchend',e=>{
  if(!WSW.active||!welcomeActive())return;
  const dy=e.changedTouches[0].clientY-WSW.y; WSW.active=false;
  if(Date.now()-WSW.t>550){
    if(dy<-50){ wNext(); WSW.t=Date.now(); }
    else if(dy>50){ wPrev(); WSW.t=Date.now(); }
  }
},{passive:true});
document.addEventListener('wheel',e=>{
  if(!welcomeActive())return;
  if(Date.now()-WSW.t<550)return;
  if(e.deltaY>25){ wNext(); WSW.t=Date.now(); }
  else if(e.deltaY<-25){ wPrev(); WSW.t=Date.now(); }
},{passive:true});
window.addEventListener('scroll',()=>{ xexpand(); },{passive:true});
document.getElementById('app').addEventListener('scroll',()=>{ xexpand(); },{passive:true});
document.addEventListener('click',e=>{
  const stage=e.target.closest&&e.target.closest('.carousel');
  if(!stage)return;
  if(e.target.closest&&e.target.closest('[data-action]'))return;
  if(CAR.dragged){ CAR.dragged=false; return; }
  /* 3D hit-testing can miss the card; resolve geometrically */
  let best=null,bestA=1e9;
  stage.querySelectorAll('.ccard').forEach(c=>{
    const r=c.getBoundingClientRect();
    if(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom){
      const i2=+c.dataset.idx;
      let a=((i2*CAR.step+CAR.angle)%360+360)%360; if(a>180)a-=360;
      if(Math.abs(a)<bestA){ bestA=Math.abs(a); best=c; }
    }
  });
  if(best)ACTIONS.carCard({idx:best.dataset.idx,topic:best.dataset.topic});
});
document.addEventListener('pointerdown',e=>{
  if(welcomeActive()){ WSW.y=e.clientY; WSW.active=true; }
  const mg=e.target.closest&&e.target.closest('#msgs:not(.locked) .msg');
  if(mg){
    REACT.sx=e.clientX; REACT.sy=e.clientY;
    clearTimeout(REACT.t);
    REACT.t=setTimeout(()=>{ REACT.t=null; openReactPicker(mg); },450);
  }
  const ff=e.target.closest&&e.target.closest('#flipcard .face.front');
  if(ff){
    FLIP.drag={x:e.clientX}; FLIP.dx=0; FLIP.dragged=false;
    const inner=document.querySelector('#flipcard .flipinner');
    if(inner)inner.style.transition='none';
  }
  const el=e.target.closest&&e.target.closest('.carousel');
  if(!el)return;
  CAR.drag={x:e.clientX,y:e.clientY,angle:CAR.angle,moved:false,samples:[[performance.now(),CAR.angle]]};
  CAR.dragged=false; CAR.vel=0; CAR.mode='idle';
  el.classList.add('dragging');
  /* no pointer capture: it would retarget the pick click away from the card */
});
document.addEventListener('pointermove',e=>{
  if(CAR.drag){
    const dx=e.clientX-CAR.drag.x, dy=e.clientY-CAR.drag.y;
    if(!CAR.drag.moved){
      /* mostly cross-axis gesture cancels the drag so the page can scroll */
      if(Math.abs(dy)>10&&Math.abs(dy)>Math.abs(dx)*1.5){
        CAR.drag=null;
        const st0=document.getElementById('carousel'); if(st0)st0.classList.remove('dragging');
      }else if(Math.abs(dx)>5){ CAR.drag.moved=true; CAR.dragged=true; CAR.mode='drag'; }
    }
    if(CAR.drag&&CAR.drag.moved){
      const degPerPx=180/(Math.PI*CAR.r);
      CAR.angle=CAR.drag.angle+dx*degPerPx;
      const now=performance.now();
      CAR.drag.samples.push([now,CAR.angle]);
      while(CAR.drag.samples.length>2&&now-CAR.drag.samples[0][0]>110)CAR.drag.samples.shift();
      applyAngle();
    }
  }
  const stg=e.target.closest&&e.target.closest('.carousel');
  CAR.hover=!!stg;
  if(REACT.t&&(Math.abs(e.clientX-REACT.sx)>8||Math.abs(e.clientY-REACT.sy)>8)){ clearTimeout(REACT.t); REACT.t=null; }
  if(FLIP.drag){
    FLIP.dx=e.clientX-FLIP.drag.x;
    if(Math.abs(FLIP.dx)>8)FLIP.dragged=true;
    const inner=document.querySelector('#flipcard .flipinner');
    if(inner){
      const base=MSTATE.aboutOpen?180:0;
      inner.style.transform='rotateY('+(base+FLIP.dx*0.35).toFixed(1)+'deg)';
    }
  }
  const rb=e.target.closest&&e.target.closest('.rbfolder');
  if(rb){
    const rr=rb.getBoundingClientRect();
    const px2=(e.clientX-rr.left)/rr.width-0.5, py2=(e.clientY-rr.top)/rr.height-0.5;
    rb.style.setProperty('--rty',(px2*10).toFixed(2)+'deg');
    rb.style.setProperty('--rtx',(-py2*8).toFixed(2)+'deg');
  }
  const rt=e.target.closest&&e.target.closest('.rate');
  if(rt){
    RATE_EL=rt;
    rt.querySelectorAll('.rstar').forEach(st=>{
      const r=st.getBoundingClientRect();
      const d=Math.abs(e.clientX-(r.left+r.width/2));
      const lift=Math.max(0,12-d/12);
      st.style.transform='translateY('+(-lift).toFixed(1)+'px)';
    });
  } else if(RATE_EL){
    RATE_EL.querySelectorAll('.rstar').forEach(st=>st.style.transform='');
    RATE_EL=null;
  }
  const el=e.target.closest&&e.target.closest('.spot');
  if(!el)return;
  const r=el.getBoundingClientRect();
  el.style.setProperty('--mx',(e.clientX-r.left)+'px');
  el.style.setProperty('--my',(e.clientY-r.top)+'px');
});
document.addEventListener('pointerup',e=>{
  if(WSW.active){
    const dy=e.clientY-WSW.y; WSW.active=false;
    if(Date.now()-WSW.t>550){
      if(dy<-50){ wNext(); WSW.t=Date.now(); }
      else if(dy>50){ wPrev(); WSW.t=Date.now(); }
    }
  }
  if(REACT.t){ clearTimeout(REACT.t); REACT.t=null; }
  if(FLIP.drag){
    const inner=document.querySelector('#flipcard .flipinner');
    if(inner){ inner.style.transition=''; inner.style.transform=''; }
    if(Math.abs(FLIP.dx)>70){
      MSTATE.aboutOpen=!MSTATE.aboutOpen;
      const el=document.getElementById('flipcard');
      if(el)el.classList.toggle('flipped',MSTATE.aboutOpen);
      FLIP.dragged=true;
    }
    FLIP.drag=null; FLIP.dx=0;
  }
  if(!CAR.drag)return;
  const st1=document.getElementById('carousel');
  if(st1)st1.classList.remove('dragging');
  let v=0;
  const smp=CAR.drag.samples;
  if(CAR.drag.moved&&smp.length>1){
    const t0=smp[0][0], a0=smp[0][1], t1=smp[smp.length-1][0], a1=smp[smp.length-1][1];
    if(t1>t0)v=Math.max(-1400,Math.min(1400,(a1-a0)/((t1-t0)/1000)));
  }
  const moved=CAR.drag.moved;
  CAR.drag=null;
  if(moved){
    /* momentum 0.6 -> tau 1.08; snap to nearest step on release */
    const tau=0.18+0.6*1.5;
    CAR.target=Math.round((CAR.angle+v*tau*0.55)/CAR.step)*CAR.step;
    CAR.vel=v; CAR.mode='spring'; CAR.hold=Date.now()+2800;
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target&&e.target.id==='chatIn'){
    e.preventDefault();
    const b=document.querySelector('[data-action=sendMsg]');
    if(b)b.dispatchEvent(new MouseEvent('click',{bubbles:true}));
    return;
  }
  if(e.key==='Escape'&&MENU.open){ MENU.open=false; renderMenu(); return; }
  if(!document.getElementById('carousel'))return;
  if(e.target.closest&&e.target.closest('input,textarea,select'))return;
  const snap=Math.round(CAR.angle/CAR.step)*CAR.step;
  if(e.key==='ArrowLeft'){ CAR.target=snap+CAR.step; CAR.mode='spring'; CAR.hold=Date.now()+2800; }
  else if(e.key==='ArrowRight'){ CAR.target=snap-CAR.step; CAR.mode='spring'; CAR.hold=Date.now()+2800; }
  else if(e.key==='Home')carGo(0);
  else if(e.key==='End')carGo(CAR.n-1);
});
