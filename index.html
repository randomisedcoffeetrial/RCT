<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Randomised Coffee Trial</title>
<style>
:root{
  --bg:#F7F0E1; --card:#FFFCF4; --ink:#1B160E; --line:#1B160E; --muted:#6E655A;
  --orange:#EB5A2D; --yellow:#F7C64B; --purple:#C9B8F2; --blue:#3D52E0; --green:#8FD6AD; --pink:#F5A9C6;
  --accent:#EB5A2D; --accent-ink:#FFFFFF; --accent-soft:#F7C64B;
  --good:#1F6B3B; --good-soft:#BFE8CF; --warn:#B23A12; --warn-soft:#F7D9CB;
  --focus:#3D52E0; --sh:3px 3px 0 var(--line); --shbig:5px 5px 0 var(--line); --r:16px; --bw:2px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#191410; --card:#241E15; --ink:#F4EBDC; --line:#F4EBDC; --muted:#A79A87;
    --orange:#F26B3F; --yellow:#E9B83F; --purple:#A892E0; --blue:#7D8CF0; --green:#74BD93; --pink:#E295B5;
    --accent:#F26B3F; --accent-ink:#1B160E; --accent-soft:#E9B83F;
    --good:#9FE0B8; --good-soft:#2C4434; --warn:#F0A07E; --warn-soft:#45301F;
  }
}
:root[data-theme="dark"]{
  --bg:#191410; --card:#241E15; --ink:#F4EBDC; --line:#F4EBDC; --muted:#A79A87;
  --orange:#F26B3F; --yellow:#E9B83F; --purple:#A892E0; --blue:#7D8CF0; --green:#74BD93; --pink:#E295B5;
  --accent:#F26B3F; --accent-ink:#1B160E; --accent-soft:#E9B83F;
  --good:#9FE0B8; --good-soft:#2C4434; --warn:#F0A07E; --warn-soft:#45301F;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:ui-rounded,-apple-system,'SF Pro Rounded','Arial Rounded MT Bold','Nunito','Segoe UI',system-ui,sans-serif;
  font-size:15px; line-height:1.5;
}
#protoBanner{background:var(--ink); color:var(--bg); text-align:center; font-size:11px; padding:5px 16px; font-weight:700}
#shell{display:flex; flex-direction:column; min-height:calc(100vh - 27px)}
main{flex:1 1 auto; width:100%; max-width:720px; margin:0 auto; padding:8px 16px 110px}
header.app{display:flex; align-items:center; gap:10px; padding:12px 16px; width:100%; max-width:720px; margin:0 auto}
.logo{display:flex; align-items:center; justify-content:center; width:38px; height:38px; border-radius:50%;
  background:var(--orange); color:#fff; border:var(--bw) solid var(--line); box-shadow:var(--sh); flex:0 0 auto}
.logo svg{width:20px; height:20px}
.brand h1{font-size:16px; margin:0; font-weight:800; letter-spacing:-.01em; line-height:1.15}
.weekchip{margin-left:auto; background:var(--yellow); border:var(--bw) solid var(--line); box-shadow:var(--sh);
  border-radius:999px; padding:4px 13px; font-size:12px; white-space:nowrap; font-weight:800}
.statusbar{display:none}
nav.bottom{position:sticky; bottom:0; z-index:30; width:100%; max-width:720px; margin:0 auto;
  background:var(--card); border-top:var(--bw) solid var(--line);
  display:flex; justify-content:space-around; padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
nav.bottom:empty{display:none}
nav.bottom button{background:none; border:none; font-family:inherit; color:var(--muted); font-size:13px; font-weight:700;
  cursor:pointer; padding:9px 14px; border-radius:10px}
nav.bottom button.on{color:var(--ink)}
#topnav{display:none; gap:6px; margin-left:14px}
#topnav button{border:var(--bw) solid transparent; background:none; font-family:inherit; font-size:13px; font-weight:700;
  color:var(--muted); padding:6px 13px; border-radius:999px; cursor:pointer}
#topnav button:hover{color:var(--ink)}
#topnav button.on{background:var(--card); color:var(--ink); border-color:var(--line); box-shadow:var(--sh)}
html[data-layout="desktop"] nav.bottom{display:none}
html[data-layout="desktop"] #topnav{display:flex}
html[data-layout="desktop"] header.app{max-width:1000px; padding:14px 28px}
html[data-layout="desktop"] main{max-width:1000px; padding:10px 28px 100px}
html[data-layout="desktop"] .cols{display:grid; grid-template-columns:320px 1fr; gap:22px; align-items:start}
html[data-layout="desktop"] .qawrap{display:grid; grid-template-columns:1fr 1fr; gap:14px}
html[data-layout="desktop"] .qawrap .qa{margin:14px 0 0}
html.wide[data-layout="mobile"] body{background:var(--bg)}
html.wide[data-layout="mobile"] #framewrap{display:flex; justify-content:center; padding:26px 12px 90px}
html.wide[data-layout="mobile"] #shell{width:394px; height:min(830px,calc(100vh - 150px)); min-height:480px;
  background:var(--bg); border:10px solid #16130d; border-radius:48px; overflow:hidden;
  box-shadow:0 34px 90px rgba(27,22,14,.4); position:relative}
html.wide[data-layout="mobile"] main{overflow-y:auto; min-height:0; padding-bottom:40px}
html.wide[data-layout="mobile"] nav.bottom{position:static}
html.wide[data-layout="mobile"] .statusbar{display:flex; justify-content:space-between; align-items:center;
  padding:12px 26px 0; font-size:13px; font-weight:800}
.sbicons{display:flex; gap:5px; align-items:center}
.sbicons i{display:block; background:var(--ink)}
.sbicons i:nth-child(1){width:15px; height:9px; border-radius:2px; clip-path:polygon(0 100%,100% 100%,100% 0,75% 25%,0 75%)}
.sbicons i:nth-child(2){width:20px; height:10px; border-radius:3px}
html.welcome{scrollbar-width:none}
html.welcome::-webkit-scrollbar{display:none}
html.welcome main{scrollbar-width:none}
html.welcome main::-webkit-scrollbar{display:none}
/* ---- typography / helpers ---- */
.pagetitle{font-size:20px; margin:16px 2px 8px; font-weight:800; letter-spacing:-.01em}
.pagetitle.center{text-align:center}
.muted{color:var(--muted); font-size:13px}
.small{font-size:12px}
.center{text-align:center}
.footer{color:var(--muted); font-size:11px; text-align:center; margin:30px 0 10px}
hr.soft{border:none; border-top:var(--bw) dashed var(--line); opacity:.35; margin:14px 0}
details{margin:10px 0}
details summary{cursor:pointer; font-weight:800; font-size:13px}
.sectlabel{font-size:11px; color:var(--ink); text-transform:uppercase; letter-spacing:.08em; margin:12px 2px 6px; font-weight:800}
/* ---- cards ---- */
.card{background:var(--card); border:var(--bw) solid var(--line); border-radius:18px;
  padding:16px; margin:14px 0; box-shadow:var(--sh)}
.card h2{margin:0 0 6px; font-size:17px; font-weight:800; letter-spacing:-.01em}
.card h3{margin:14px 0 6px; font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.07em}
.card p{margin:6px 0}
.notice{background:var(--card); border:var(--bw) dashed var(--line); border-radius:14px; padding:10px 13px; font-size:13px; margin:10px 0}
.notice.good{background:var(--good-soft); border-style:solid}
.notice.warn{background:var(--warn-soft); border-style:solid}
.darkcard{background:var(--ink); color:var(--bg); border-radius:18px; padding:16px; margin:14px 0; border:var(--bw) solid var(--line)}
.darkcard h2{color:var(--bg); margin:0 0 6px; font-size:17px; font-weight:800}
.darkcard .muted{color:color-mix(in srgb,var(--bg) 70%,transparent)}
.ruletag{display:inline-block; border:var(--bw) solid var(--bg); border-radius:999px; padding:2px 10px;
  font-size:11px; font-weight:700; margin:3px 4px 0 0; color:var(--bg)}
.ruletag.ok{background:var(--green); color:var(--ink); border-color:var(--ink)}
/* ---- buttons / inputs ---- */
.btn{display:inline-block; border:var(--bw) solid var(--line); background:var(--card); color:var(--ink);
  border-radius:999px; padding:9px 18px; font-size:14px; cursor:pointer; font-weight:800; font-family:inherit;
  margin:4px 6px 4px 0; box-shadow:var(--sh); transition:transform .1s ease, box-shadow .1s ease}
.btn:hover{transform:translate(-1px,-1px); box-shadow:4px 4px 0 var(--line)}
.btn:active{transform:translate(2px,2px); box-shadow:1px 1px 0 var(--line)}
.btn.primary{background:var(--yellow); color:var(--ink)}
.btn.dark{background:var(--ink); color:var(--bg)}
.btn.orange{background:var(--orange); color:#fff}
.btn.small{padding:5px 13px; font-size:12px}
.btn.danger{background:var(--warn-soft); color:var(--warn)}
.btn[disabled]{opacity:.5; cursor:not-allowed}
.linkbtn{background:none; border:none; color:var(--muted); font-size:12px; font-weight:700; cursor:pointer;
  font-family:inherit; text-decoration:underline; padding:4px 2px; margin:2px 8px 2px 0}
.btn:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,
.linkbtn:focus-visible,.chip:focus-visible,.tchip:focus-visible,.cctile:focus-visible,.fab:focus-visible,.seg button:focus-visible,.daypill:focus-visible{
  outline:3px solid var(--focus); outline-offset:2px}
label.f{display:block; margin:12px 0 4px; font-weight:800; font-size:12px; text-transform:uppercase; letter-spacing:.06em}
label.f .opt{font-weight:600; color:var(--muted); text-transform:none; letter-spacing:0}
input[type=text],input[type=search],input[type=password],select,textarea{
  width:100%; padding:9px 12px; border:var(--bw) solid var(--line); border-radius:12px;
  background:var(--card); color:var(--ink); font-family:inherit; font-size:14px}
textarea{min-height:64px; resize:vertical}
/* ---- chips / tags ---- */
.chips{display:flex; flex-wrap:wrap; gap:7px; margin:8px 0}
.chip{background:var(--card); border:var(--bw) solid var(--line); border-radius:999px;
  padding:5px 13px; font-size:12px; font-weight:700; cursor:pointer; font-family:inherit; color:var(--ink); box-shadow:var(--sh)}
.chip:hover{transform:translate(-1px,-1px)}
.chip.on{background:var(--ink); color:var(--bg)}
.tag{display:inline-block; background:var(--purple); border:var(--bw) solid var(--line);
  border-radius:999px; padding:2px 10px; font-size:11px; font-weight:700; margin:2px 4px 2px 0}
.tier{display:inline-block; border:var(--bw) solid var(--line); border-radius:999px; padding:2px 11px; font-size:12px; font-weight:800}
.tier.mutual{background:var(--green)}
.tier.wild{background:var(--yellow)}
.badge{display:inline-block; background:var(--orange); color:#fff; border:var(--bw) solid var(--line);
  border-radius:999px; font-size:11px; font-weight:800; padding:1px 7px; margin-left:6px; vertical-align:1px}
/* ---- topic chips (picker cloud) ---- */
.tcloud{display:flex; flex-wrap:wrap; gap:9px; justify-content:center; margin:12px 0}
.tchip{display:inline-flex; flex-direction:column; align-items:flex-start; gap:1px;
  background:var(--card); border:var(--bw) solid var(--line); border-radius:14px; padding:7px 12px;
  font-family:inherit; color:var(--ink); cursor:pointer; text-align:left; box-shadow:var(--sh);
  transition:transform .1s ease}
.tchip:hover{transform:translate(-1px,-1px)}
.tchip:active{transform:translate(1px,1px)}
.tchip .tcat{display:flex; align-items:center; gap:4px; font-size:8.5px; font-weight:800; letter-spacing:.07em;
  text-transform:uppercase; color:var(--muted)}
.tchip .tcat i{width:7px; height:7px; border-radius:50%; border:1.5px solid var(--line); background:var(--tc,var(--yellow)); display:inline-block}
.tchip .tname{font-size:13px; font-weight:800}
.tchip .tk{display:none; font-size:11px; font-weight:800}
.tchip.on{background:var(--tc,var(--yellow))}
.tchip.on .tcat{color:var(--ink)}
.tchip.on .tk{display:inline; margin-left:4px}
.topicwrap{text-align:center}
/* ---- countdown ---- */
.countdown{display:flex; gap:12px; justify-content:center; margin:12px 0}
.countdown .tcell{text-align:center; min-width:80px; background:var(--ink); color:var(--bg);
  border:var(--bw) solid var(--line); border-radius:16px; padding:12px 8px}
.countdown .tcell:nth-child(1){box-shadow:4px 4px 0 var(--orange)}
.countdown .tcell:nth-child(2){box-shadow:4px 4px 0 var(--yellow)}
.countdown .tcell:nth-child(3){box-shadow:4px 4px 0 var(--purple)}
.countdown .n{font-size:28px; font-weight:800; font-variant-numeric:tabular-nums}
.countdown .l{font-size:9px; color:color-mix(in srgb,var(--bg) 70%,transparent); text-transform:uppercase; letter-spacing:.09em; font-weight:800}
.odo{display:inline-flex}
.odigit{display:inline-block; height:1em; line-height:1; overflow:hidden}
.ostack{display:block; transition:transform .8s cubic-bezier(.25,1.2,.35,1)}
.ostack b{display:block; height:1em; line-height:1; font-weight:inherit}
/* ---- welcome ---- */
.bigtitle{font-size:40px; line-height:1.08; font-weight:800; letter-spacing:-.02em; margin:18px 0 10px}
.titlehl{display:inline-block; background:var(--orange); color:#fff; border:var(--bw) solid var(--line);
  border-radius:14px; padding:0 10px; box-shadow:var(--sh); transform:rotate(-1.5deg)}
.illus{border:var(--bw) solid var(--line); border-radius:18px; box-shadow:var(--shbig); overflow:hidden; margin:16px 0; background:var(--purple)}
.illus svg{display:block; width:100%; height:auto}
.how2{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:12px 0}
.how2 div{border:var(--bw) solid var(--line); border-radius:16px; padding:14px; font-weight:800; font-size:14px;
  box-shadow:var(--sh); min-height:88px}
.how2 .c1{background:var(--yellow)} .how2 .c2{background:var(--purple)}
.how2 .c3{background:var(--green)} .how2 .c4{background:var(--orange); color:#fff}
.how2 .hnum{display:inline-flex; width:24px; height:24px; border-radius:50%; background:var(--card); color:var(--ink);
  border:var(--bw) solid var(--line); align-items:center; justify-content:center; font-size:12px; margin-bottom:8px}
.brandnew{display:inline-block; background:var(--card); border:var(--bw) solid var(--line); border-radius:999px;
  padding:1px 10px; font-size:10px; font-weight:800; letter-spacing:.07em; margin-bottom:6px}
/* ---- blue match-reveal hero ---- */
.bluehero{position:relative; background:var(--blue); border:var(--bw) solid var(--line); border-radius:20px;
  padding:20px 16px 22px; margin:14px 0; box-shadow:var(--shbig); overflow:hidden}
.bluehero .pagetitle{color:#fff; margin:4px 0 14px; position:relative; z-index:2}
.bluehero .deco{position:absolute; inset:0; pointer-events:none; z-index:1}
.revealcard{position:relative; z-index:2; background:var(--card); border:var(--bw) solid var(--line);
  border-radius:18px; padding:18px 16px; text-align:center; box-shadow:var(--sh)}
.revealcard .dashes{border-top:var(--bw) dashed var(--line); opacity:.5; margin:12px 20px}
.bluehero .btn.ghost{background:transparent; color:#fff; border-color:#fff; box-shadow:3px 3px 0 rgba(0,0,0,.4)}
/* ---- profile ---- */
.pcard{background:var(--purple); border:var(--bw) solid var(--line); border-radius:18px; overflow:hidden;
  margin:14px 0; box-shadow:var(--sh)}
.pcover{display:none}
.avatar{width:64px; height:64px; border-radius:50%; background:var(--orange); color:#fff;
  display:flex; align-items:center; justify-content:center; font-size:26px; font-weight:800;
  border:var(--bw) solid var(--line); margin:14px 0 0 16px; position:relative}
.avatar.big{width:84px; height:84px; font-size:34px; margin:0 0 10px}
.phead{padding:4px 16px 14px}
.phead h2{margin:4px 0 0; font-size:19px; font-weight:800}
.qawrap{margin:4px 0}
.qa{margin:18px 0 0; background:var(--card); border:var(--bw) solid var(--line);
  border-radius:14px; padding:16px 14px 11px; box-shadow:var(--sh); position:relative}
.qa .q{position:absolute; top:-11px; left:12px; background:var(--qc,var(--yellow));
  border:var(--bw) solid var(--line); border-radius:999px; padding:1px 9px;
  font-size:9px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; white-space:nowrap;
  max-width:calc(100% - 24px); overflow:hidden; text-overflow:ellipsis}
.qa .a{font-size:14px; font-weight:600}
.qawrap .qa:nth-child(5n+1){--qc:var(--yellow)}
.qawrap .qa:nth-child(5n+2){--qc:var(--pink)}
.qawrap .qa:nth-child(5n+3){--qc:var(--orange)}
.qawrap .qa:nth-child(5n+4){--qc:var(--green)}
.qawrap .qa:nth-child(5n+5){--qc:var(--purple)}
.card .qa{box-shadow:none}
.proftools{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:8px 0 12px}
.proftools .listlink{margin:0}
.proftools .listlink b{color:var(--ink)}
.proftools .chev{margin-left:auto; font-size:20px; line-height:1}
@media (max-width:380px){ .proftools{grid-template-columns:1fr} }
/* ---- spotlight (kept subtle) ---- */
.spot{position:relative; overflow:hidden}
.spot::after{content:''; position:absolute; inset:0; opacity:0; transition:opacity .25s; pointer-events:none;
  background:radial-gradient(150px circle at var(--mx,50%) var(--my,50%), rgba(255,255,255,.35), transparent 70%)}
.spot:hover::after{opacity:1}
/* ---- list rows ---- */
.listlink{display:flex; align-items:center; gap:12px; width:100%; text-align:left;
  background:var(--card); border:var(--bw) solid var(--line); border-radius:14px;
  padding:13px 14px; margin:10px 0; font-family:inherit; font-size:14px; color:var(--ink); cursor:pointer;
  box-shadow:var(--sh); transition:transform .1s ease}
.listlink:hover{transform:translate(-1px,-1px)}
.listlink .d{color:var(--muted); font-size:12px; display:block; font-weight:600}
.listlink b{font-weight:800}
/* ---- chat / slots ---- */
.chatcard{padding:0; overflow:hidden}
.darkhead{background:var(--ink); color:var(--bg); font-weight:800; font-size:16px; padding:12px 16px;
  border-bottom:var(--bw) solid var(--line)}
.chatbody{padding:12px 16px 16px}
.msg{max-width:85%; padding:8px 12px; border-radius:14px; margin:6px 0; font-size:13px; font-weight:600;
  border:var(--bw) solid var(--line)}
.msg.me{background:var(--yellow); margin-left:auto; border-bottom-right-radius:4px}
.msg.them{background:var(--card); border-bottom-left-radius:4px}
.msg .who{font-size:10px; opacity:.7; display:block; font-weight:800}
.chatbox{display:flex; gap:8px; margin-top:10px}
.chatbox input{flex:1}
.slot{display:flex; align-items:center; gap:8px; background:var(--card); border:var(--bw) solid var(--line);
  border-radius:14px; padding:9px 12px; margin:8px 0; font-size:13px; font-weight:700; box-shadow:var(--sh)}
.slot .btn{margin:0 0 0 auto}
.slot.chosen{background:var(--green)}
/* ---- plan pills ---- */
.safebanner{display:flex; align-items:center; gap:10px; background:var(--green); border:var(--bw) solid var(--line);
  border-radius:16px; padding:11px 14px; margin:14px 0; font-size:13px; font-weight:700; box-shadow:var(--sh)}
.safebanner svg{flex:0 0 auto}
.planhead .with{color:var(--muted); font-weight:700; font-size:13px; margin-top:-4px}
.pillgrp{display:flex; flex-wrap:wrap; gap:7px; margin:6px 0 2px}
.daypill{border:var(--bw) solid var(--line); background:var(--card); color:var(--ink); border-radius:999px;
  padding:5px 11px; font-size:12px; font-weight:800; font-family:inherit; cursor:pointer; box-shadow:var(--sh)}
.daypill.on{background:var(--ink); color:var(--bg)}
.daypill.day{padding:5px 9px}
.sumpill{display:inline-block; background:var(--yellow); border:var(--bw) solid var(--line); border-radius:14px;
  padding:9px 14px; font-size:13px; font-weight:800; margin:14px 0 4px; box-shadow:var(--sh)}
/* ---- stats / sparks ---- */
.statrow{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:12px; margin:12px 0}
.stat{background:var(--card); border:var(--bw) solid var(--line); border-radius:14px; padding:12px; text-align:center; box-shadow:var(--sh)}
.stat .n{font-size:24px; font-weight:800}
.stat .l{font-size:11px; color:var(--muted); font-weight:700}
.spark{border:var(--bw) solid var(--line); border-left:8px solid var(--orange); border-radius:12px;
  background:var(--card); padding:8px 12px; margin:12px 0; box-shadow:var(--sh)}
.spark .meta{font-size:11px; color:var(--muted); font-weight:700}
.spark .t{font-size:14px; font-style:italic; font-weight:600}
/* ---- misc ---- */
.steps{display:flex; gap:6px; margin:6px 0 14px}
.steps span{flex:1; height:8px; border-radius:4px; background:var(--card); border:var(--bw) solid var(--line)}
.steps span.on{background:var(--orange)}
.orcidbox{border:var(--bw) solid var(--line); border-radius:16px; padding:14px; margin:10px 0; background:var(--card); box-shadow:var(--sh)}
.orcidbox .obh{font-weight:800; font-size:13px; margin-bottom:6px}
.searchres{border:var(--bw) solid var(--line); border-radius:14px; margin-top:8px; overflow:hidden; background:var(--card); box-shadow:var(--sh)}
.searchres .grp{background:var(--bg); padding:5px 12px; font-size:10px; color:var(--muted); font-weight:800; text-transform:uppercase; letter-spacing:.06em}
.searchres button{display:block; width:100%; text-align:left; background:var(--card); color:var(--ink);
  border:none; border-top:1px solid color-mix(in srgb,var(--line) 25%,transparent); padding:9px 12px; font-size:13px; font-weight:700; font-family:inherit; cursor:pointer}
.searchres button:hover{background:var(--yellow)}
.diag{font-size:12px}
.diag table{width:100%; border-collapse:collapse; margin:8px 0}
.diag td,.diag th{border-bottom:1px solid color-mix(in srgb,var(--line) 30%,transparent); padding:5px 6px; text-align:left; vertical-align:top}

function haversine(a,b){
  const R=6371, rad=x=>x*Math.PI/180;
  const dLat=rad(b.lat-a.lat), dLon=rad(b.lon-a.lon);
  const h=Math.sin(dLat/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
function lev(a,b){
  if(Math.abs(a.length-b.length)>2)return 9;
  const m=[...Array(a.length+1)].map((_,i)=>[i,...Array(b.length)]);
  for(let j=0;j<=b.length;j++)m[0][j]=j;
  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)

/* ============ matching engine (section 9 of the handover) ============ */
const T_MUTUAL=0.75;
function pairEval(A,B){
  /* hard filters */
  if(isPaused(A)||isPaused(B))return {ok:false,why:'paused'};
  if(!A.verified||!B.verified)return {ok:false,why:'unverified'};
  if(A.matchedBefore.includes(B.id))return {ok:false,why:'already matched before (never re-matched)'};
  if(A.blocked.includes(B.id)||B.blocked.includes(A.id))return {ok:false,why:'blocked'};
  const d=userDist(A,B);
  if(d>A.maxKm||d>B.maxKm)return {ok:false,why:'outside travel range ('+d.toFixed(0)+' km)'};
  const overlap=A.availability.filter(w=>B.availability.includes(w));
  if(overlap.length===0)return {ok:false,why:'no availability overlap'};
  /* scores and tier */
  const sAB=interestScore(A,B), sBA=interestScore(B,A);
  const mutual=sAB>=T_MUTUAL&&sBA>=T_MUTUAL;
  const oneWay=!mutual&&(sAB>=T_MUTUAL||sBA>=T_MUTUAL);
  const tier=mutual?'mutual':oneWay?'oneWay':'open';
  const union=new Set([...A.availability,...B.availability]).size;
  const diffDiv=TOPIC[A.backgroundTopics[0]].div!==TOPIC[B.backgroundTopics[0]].div;
  const tierBase=mutual?1000:oneWay?500:0;
  const topicBonus=40*(sAB+sBA)/2;
  const prox=Math.max(0,15*(1-d/Math.min(A.maxKm,B.maxKm)));
  const avail=10*(overlap.length/union);
  const bridge=(tier==='open'&&diffDiv)?10:0;
  const carry=25*(A.unmatchedLastWeek?1:0)+25*(B.unmatchedLastWeek?1:0);
  const weight=tierBase+topicBonus+prox+avail+bridge+carry;
  return {ok:true,tier,sAB,sBA,d,overlap,weight,parts:{tierBase,topicBonus,prox,avail,bridge,carry}};
}
function matchReason(ev,A,B){
  if(ev.tier==='mutual')return 'You are each curious about the other’s field, you are '+ev.d.toFixed(1)+' km apart, and your weeks overlap.';
  if(ev.tier==='oneWay')return 'There is a strong curiosity link between your fields, and you are nearby with overlapping availability.';
  return 'No mutual match existed this week, so we suggest someone nearby from a different corner of research. Everyone has something to share.';
}
function runMatching(){
  const wk=S.week;
  if(weekRun(wk)){ toast('Matching has already run for week '+wk); return; }
  const users=Object.values(S.users);
  const active=users.filter(u=>u.verified&&!isPaused(u));
  const diag={perUser:{},unmatched:[],pairs:0};
  active.forEach(u=>diag.perUser[u.id]={candidates:[],matchedWith:null});
  const evCache={};
  const eligible=[];
  for(let i=0;i<active.length;i++)for(let j=i+1;j<active.length;j++){
    const A=active[i],B=active[j];
    const ev=pairEval(A,B); evCache[A.id+'|'+B.id]=ev;
    diag.perUser[A.id].candidates.push({id:B.id,ev});
    diag.perUser[B.id].candidates.push({id:A.id,ev});
    if(ev.ok)eligible.push({a:A.id,b:B.id,ev});
  }
  /* Greedy by descending weight, then a swap-improvement pass.
     NOT guaranteed optimal; the real version should use a proper
     maximum-weight (blossom) matching, e.g. NetworkX max_weight_matching. */
  eligible.sort((x,y)=>y.ev.weight-x.ev.weight);
  const used=new Set(); let chosen=[];
  for(const p of eligible){ if(!used.has(p.a)&&!used.has(p.b)){ chosen.push(p); used.add(p.a); used.add(p.b); } }
  const getEv=(x,y)=>evCache[x+'|'+y]||evCache[y+'|'+x];
  for(let pass=0;pass<2;pass++){
    for(let i=0;i<chosen.length;i++)for(let j=i+1;j<chosen.length;j++){
      const p=chosen[i],q=chosen[j];
      const cur=p.ev.weight+q.ev.weight;
      const alts=[[p.a,q.a,p.b,q.b],[p.a,q.b,p.b,q.a]];
      for(const[a1,b1,a2,b2]of alts){
        const e1=getEv(a1,b1),e2=getEv(a2,b2);
        if(e1&&e1.ok&&e2&&e2.ok&&e1.weight+e2.weight>cur){
          chosen[i]={a:a1,b:b1,ev:e1}; chosen[j]={a:a2,b:b2,ev:e2};
        }
      }
    }
  }
  /* create matches */
  for(const p of chosen){
    const A=S.users[p.a],B=S.users[p.b];
    const m={id:'m'+wk+'-'+p.a+'-'+p.b,week:wk,a:p.a,b:p.b,tier:p.ev.tier,
      scoreAB:+p.ev.sAB.toFixed(2),scoreBA:+p.ev.sBA.toFixed(2),distanceKm:+p.ev.d.toFixed(1),
      reason:matchReason(p.ev,A,B),status:'planning',slots:[],chosenSlot:null,venueType:null,
      duration:null,messages:[],contactShare:{},logged:null};
    S.matches.push(m);
    A.matchedBefore.push(B.id); B.matchedBefore.push(A.id);
    diag.perUser[p.a].matchedWith=p.b; diag.perUser[p.b].matchedWith=p.a;
  }
  diag.pairs=chosen.length;
  /* carry-over flags */
  for(const u of active){
    const got=chosen.some(p=>p.a===u.id||p.b===u.id);
    u.unmatchedLastWeek=!got;
    if(!got)diag.unmatched.push(u.id);
  }
  S.runWeeks.push(wk);
  S.diag[wk]=diag;
  save(); render();
  toast('Week '+wk+': '+chosen.length+' matches made, '+diag.unmatched.length+' people unmatched');
}

function carTick(ts){
  CAR.raf=null;
  const stage=document.getElementById('carousel');
  if(!stage)return;
  if(!CAR.lastT)CAR.lastT=ts;
  const dt=Math.min(0.05,(ts-CAR.lastT)/1000); CAR.lastT=ts;
  if(CAR.mode==='spring'){
    /* spring: stiffness 118, critical damping, 1/240s substeps */
    const k=118, cd=2*Math.sqrt(k);
    const steps=Math.max(1,Math.round(dt*240)), h=dt/steps;
    for(let z=0;z<steps;z++){
      const x=CAR.angle-CAR.target;
      CAR.vel+=(-k*x-cd*CAR.vel)*h;
      CAR.angle+=CAR.vel*h;
    }
    if(Math.abs(CAR.angle-CAR.target)<0.004&&Math.abs(CAR.vel)<0.03){ CAR.angle=CAR.target; CAR.vel=0; CAR.mode='idle'; }
    applyAngle();
  }else if(CAR.mode!=='drag'){
    /* autoplay drift at 14 deg/s; pauses on hover, drags and holds */
    if(!CAR.hover&&!carReduced()&&Date.now()>CAR.hold){ CAR.angle-=14*dt; applyAngle(); }
  }
  CAR.raf=requestAnimationFrame(carTick);
}

  const target=days.indexOf(dayName); if(target<0)return Date.now()+3*86400000;
  const h=Math.floor(hourF),mi=Math.round((hourF-h)*60);
  const cand=new Date(); cand.setHours(h,mi,0,0);
  let add=(target-cand.getDay()+7)%7;

const PICK={q:'',kind:null};
function searchTopics(q){
  q=q.trim().toLowerCase(); if(q.length<2)return[];
  const qTokens=q.split(/\s+/);
  const scored=[];
  for(const id in TOPIC){
    const t=TOPIC[id];
    const cands=[t.label.toLowerCase(),...t.syn.map(s=>s.toLowerCase()),t.subLabel.toLowerCase()];
    let best=0;
    for(const c of cands){
      if(c===q)best=Math.max(best,5);
      else if(c.includes(q))best=Math.max(best,4);
      else{
        const cTok=c.split(/\s+/);
        let hit=0;
        for(const qt of qTokens){
          if(cTok.some(ct=>ct.startsWith(qt)))hit+=2;
          else if(qt.length>3&&cTok.some(ct=>lev(qt,ct)<=2))hit+=1;
        }
        best=Math.max(best,hit/qTokens.length);
      }
    }
    if(best>=1)scored.push({id,best});
  }
  scored.sort((a,b)=>b.best-a.best);
  return scored.slice(0,8).map(s=>s.id);
}

function topicsNearby(u){
  /* topics held by active profiles within the user's travel range; names only, no counts, no identities */
  const set=new Set();
  Object.values(S.users).forEach(o=>{
    if(o.id===u.id||!o.verified||isPaused(o))return;
    if(!u.area||!o.area)return;
    if(userDist(u,o)<=u.maxKm)o.backgroundTopics.forEach(t=>set.add(t));
  });
  (u.backgroundTopics||[]).forEach(t=>set.delete(t));
  return [...set];
}

V.dashboard=function(){
  const happened=S.matches.filter(m=>m.status==='happened');
  const all=S.matches.filter(m=>['happened','scheduled','planning','noShow','cancelled'].includes(m.status));
  const mut=all.filter(m=>m.tier==='mutual').length;
  const pcMut=all.length?Math.round(100*mut/all.length):0;
  const sv=S.surveys;
  const learned=sv.length?Math.round(100*sv.filter(s=>s.learnedUnexpected>=4).length/sv.length):0;
  /* disciplinary distance: 1 - best similarity between the pair's background topics (aggregate only) */
  let dd=0;
  if(happened.length){
    dd=happened.reduce((acc,m)=>{
      const A=S.users[m.a],B=S.users[m.b]; if(!A||!B)return acc;
      let best=0; A.backgroundTopics.forEach(x=>B.backgroundTopics.forEach(y=>{const s=similarity(x,y); if(s>best)best=s;}));
      return acc+(1-best);
    },0)/happened.length;
  }
  const counts={}; Object.values(S.users).forEach(u=>{const n=S.matches.filter(m=>m.a===u.id||m.b===u.id).length; if(n>1)counts[u.id]=n;});
  const repeat=Object.keys(counts).length;
  const pauses=S.feedback.filter(f=>f.kind==='pause');
  return '<button class="btn small" data-action="nav" data-v="more">← More</button>'
   +'<div class="card"><h2>Impact dashboard</h2><p class="muted small">Aggregates only. No individual data, ever. (The sort of numbers a funder would ask for.)</p>'
   +'<div class="statrow">'
   +'<div class="stat"><div class="n">'+happened.length+'</div><div class="l">meetups happened</div></div>'
   +'<div class="stat"><div class="n">'+pcMut+'%</div><div class="l">mutual (vs wildcard)</div></div>'
   +'<div class="stat"><div class="n">'+learned+'%</div><div class="l">learned something unexpected</div></div>'
   +'<div class="stat"><div class="n">'+dd.toFixed(2)+'</div><div class="l">avg disciplinary distance (0–1)</div></div>'
   +'<div class="stat"><div class="n">'+repeat+'</div><div class="l">people with repeat meetups</div></div>'
   +'<div class="stat"><div class="n">'+pauses.length+'</div><div class="l">pauses recorded</div></div>'
   +'</div>'
   +(pauses.length?'<h3>Why people pause</h3><ul class="small">'+pauses.map(p=>'<li>'+esc(p.text||'(no reason given)')+'</li>').join('')+'</ul>':'')
   +'</div>';
};

V.explain=function(){
  const u=me();
  const wk=weekRun(S.week)?S.week:S.runWeeks[S.runWeeks.length-1];
  const d=wk!=null?S.diag[wk]:null;
  let out='<button class="btn small" data-action="nav" data-v="home">← Back</button>'
   +'<div class="card diag"><h2>How was this decided?</h2>'
   +'<p class="notice warn small"><b>Demo/admin view only.</b> Real users never see this: it exposes other people’s private interests via scores.</p>';
  if(!d){ out+='<p>No matching run yet. Use "Run this week’s matching" in the control centre.</p></div>'; return out; }
  out+='<p class="small">Week '+wk+': '+d.pairs+' pairs made. Mutual pairs (both topic-fit scores ≥ '+T_MUTUAL+') always outrank wildcards (base weight 1000 vs 500 vs 0). Topic fit uses the curated similarity layer, so "chronic pain" and "low back pain" score 0.9. Greedy pairing with a swap pass, not guaranteed optimal.</p>';
  if(d.unmatched.length)out+='<p class="small"><b>Unmatched this week (get carry-over priority):</b> '+d.unmatched.map(id=>esc(S.users[id]?S.users[id].displayName:id)).join(', ')+'</p>';
  if(u&&d.perUser[u.id]){
    const pu=d.perUser[u.id];
    const cands=[...pu.candidates].sort((a,b)=>(b.ev.ok?b.ev.weight:-1)-(a.ev.ok?a.ev.weight:-1));
    out+='<h3>Candidates for '+esc(u.displayName)+'</h3><table><tr><th>Person</th><th>Outcome</th></tr>'
     +cands.map(c=>{
       const o=S.users[c.id]; const name=o?o.displayName:c.id;
       if(!c.ev.ok)return '<tr><td>'+esc(name)+'</td><td>✕ excluded: '+esc(c.ev.why)+'</td></tr>';
       const chosen=pu.matchedWith===c.id;
       const pr=c.ev.parts;
       return '<tr><td>'+esc(name)+(chosen?' <b>← matched</b>':'')+'</td><td>'+c.ev.tier+' · weight '+c.ev.weight.toFixed(1)
        +'<br><span class="muted">fit '+c.ev.sAB.toFixed(2)+' / '+c.ev.sBA.toFixed(2)+' · '+c.ev.d.toFixed(1)+' km · base '+pr.tierBase+' + topics '+pr.topicBonus.toFixed(1)+' + prox '+pr.prox.toFixed(1)+' + avail '+pr.avail.toFixed(1)+' + bridge '+pr.bridge+' + carry '+pr.carry+'</span></td></tr>';
     }).join('')+'</table>';
    if(!pu.matchedWith)out+='<p class="small">'+esc(u.displayName)+' went unmatched: '+(pu.candidates.some(c=>c.ev.ok)?'every eligible candidate was taken by a heavier pair (odd one out).':'no candidate passed the hard filters (range, availability, history, blocks, pause).')+'</p>';
  } else if(u) out+='<p class="small">'+esc(u.displayName)+' was not in that run (paused or added later).</p>';
  out+='</div>';
  return out;
};

const FORMS={
  editProfile:(f)=>{

    ['displayName','pronouns','institution','background','stuckOn','wantExplained','canExplain','nonWork','area'].forEach(k=>u[k]=String(fd.get(k)||'').trim());

      const t=String(fd.get('pt'+i)||'').trim();
      const link=String(fd.get('pu'+i)||'').trim();

  },
  logMeetup:(f,d)=>{
    const m=S.matches.find(x=>x.id===d.m); const fd=new FormData(f);

    if(h==='yes'){ m.status='happened'; m.logged={happened:'yes',duration:String(fd.get('dur')||'').trim()}; toast('Logged. One quick survey when you’re ready.'); }

    MSTATE.notesOpen=true; render();
    toast(fd.get('shared')?'Notes saved and shared':'Notes saved, just for you');
  },
  contact:(f,d)=>{
    const m=S.matches.find(x=>x.id===d.m); const fd=new FormData(f);
    const details=String(fd.get('details')||'').trim();
    if(!details){ toast('Add what you’d like to share first'); return; }
    m.contactShare[S.me]={optIn:true,details}; render(); toast('Shared. Revealed only if they opt in too.');
  },
  pause:(f)=>{
    const u=me(); const fd=new FormData(f);
    const len=+fd.get('len');
    u.pausedUntilWeek=len===9999?9999:S.week+len;
    const why=[String(fd.get('why')||''),String(fd.get('txt')||'').trim()].filter(Boolean).join(': ');
    u.pauseReason=why;
    if(why)S.feedback.push({userId:u.id,week:S.week,kind:'pause',text:why});
    goto('home'); toast('Paused. Come back whenever.');
  }
};
/* ============ event wiring ============ */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-action]');
  if(!el)return;
  const fn=ACTIONS[el.dataset.action];
  if(fn)fn(el.dataset,el);
});
document.addEventListener('submit',e=>{
  const f=e.target.closest('[data-form]');
  if(!f)return;
  e.preventDefault();
  const fn=FORMS[f.dataset.form];
  if(fn)fn(f,f.dataset);
});
document.addEventListener('input',e=>{
  const aq=e.target.closest('[data-input="areaq"]');
  if(aq){
    const q=aq.value.trim().toLowerCase();
    const res=document.getElementById('areaRes'); if(!res)return;
    if(!q){ res.style.display='none'; res.innerHTML=''; return; }
    const hits=AREAS.filter(a=>(a.name+' '+a.city).toLowerCase().includes(q)).slice(0,8);
    res.innerHTML=hits.length
      ?hits.map(a=>'<button type="button" data-action="areaPick" data-a="'+a.id+'">'+esc(a.name)+' ('+esc(a.city)+')</button>').join('')
      :'<div class="grp">No matching area</div>';
    res.style.display='';
    return;
  }
  const el=e.target.closest('[data-input="picker"]');
  if(!el)return;
  PICK.q=el.value; PICK.kind=el.dataset.kind;
  SKIPANIM=true;
  /* re-render results only, keeping focus: simplest is full render then restore focus */
  const pos=el.selectionStart;
  render();
  const again=document.querySelector('[data-input="picker"][data-kind="'+el.dataset.kind+'"]');
  if(again){ again.focus(); try{again.setSelectionRange(pos,pos);}catch(err){} }
});
document.addEventListener('change',e=>{
  const el=e.target.closest('[data-change="persona"]');
  if(!el)return;
  if(!el.value)return;
  S.me=el.value; goto('home');
});
/* ORCID checksum: ISO 7064 mod 11-2 */
function orcidValid(str){
  const s=String(str).replace(/[^0-9Xx]/g,'').toUpperCase();
  if(!/^\d{15}[\dX]$/.test(s))return false;
  let total=0;
  for(let i=0;i<15;i++)total=(total+ +s[i])*2;
  const res=(12-(total%11))%11;
  return (res===10?'X':String(res))===s[15];
}
/* ============ init ============ */
window.addEventListener('resize',()=>{ applyLayout(); layoutCarousel(); xexpand(); });
window.addEventListener('scroll',()=>{ xexpand(); },{passive:true});
document.getElementById('app').addEventListener('scroll',()=>{ xexpand(); },{passive:true});
document.addEventListener('click',e=>{
  const stage=e.target.closest&&e.target.closest('.carousel');
  if(!stage)return;
  if(e.target.closest&&e.target.closest('[data-action]'))return;
  if(CAR.dragged){ CAR.dragged=false; return; }
  /* 3D hit-testing can miss the card; resolve geometrically */
  let best=null,bestA=1e9;
  stage.querySelectorAll('.ccard').forEach(c=>{
    const r=c.getBoundingClientRect();
    if(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom){
      const i2=+c.dataset.idx;
      let a=((i2*CAR.step+CAR.angle)%360+360)%360; if(a>180)a-=360;
      if(Math.abs(a)<bestA){ bestA=Math.abs(a); best=c; }
    }
  });
  if(best)ACTIONS.carCard({idx:best.dataset.idx,topic:best.dataset.topic});
});
document.addEventListener('pointerdown',e=>{
  const ff=e.target.closest&&e.target.closest('#flipcard .face.front');
  if(ff){
    FLIP.drag={x:e.clientX}; FLIP.dx=0; FLIP.dragged=false;
    const inner=document.querySelector('#flipcard .flipinner');
    if(inner)inner.style.transition='none';
  }
  const el=e.target.closest&&e.target.closest('.carousel');
  if(!el)return;
  CAR.drag={x:e.clientX,y:e.clientY,angle:CAR.angle,moved:false,samples:[[performance.now(),CAR.angle]]};
  CAR.dragged=false; CAR.vel=0; CAR.mode='idle';
  el.classList.add('dragging');
  /* no pointer capture: it would retarget the pick click away from the card */
});
document.addEventListener('pointermove',e=>{
  if(CAR.drag){
    const dx=e.clientX-CAR.drag.x, dy=e.clientY-CAR.drag.y;
    if(!CAR.drag.moved){
      /* mostly cross-axis gesture cancels the drag so the page can scroll */
      if(Math.abs(dy)>10&&Math.abs(dy)>Math.abs(dx)*1.5){
        CAR.drag=null;
        const st0=document.getElementById('carousel'); if(st0)st0.classList.remove('dragging');
      }else if(Math.abs(dx)>5){ CAR.drag.moved=true; CAR.dragged=true; CAR.mode='drag'; }
    }
    if(CAR.drag&&CAR.drag.moved){
      const degPerPx=180/(Math.PI*CAR.r);
      CAR.angle=CAR.drag.angle+dx*degPerPx;
      const now=performance.now();
      CAR.drag.samples.push([now,CAR.angle]);
      while(CAR.drag.samples.length>2&&now-CAR.drag.samples[0][0]>110)CAR.drag.samples.shift();
      applyAngle();
    }
  }
  const stg=e.target.closest&&e.target.closest('.carousel');
  CAR.hover=!!stg;
  if(FLIP.drag){
    FLIP.dx=e.clientX-FLIP.drag.x;
    if(Math.abs(FLIP.dx)>8)FLIP.dragged=true;
    const inner=document.querySelector('#flipcard .flipinner');
    if(inner){
      const base=MSTATE.aboutOpen?180:0;
      inner.style.transform='rotateY('+(base+FLIP.dx*0.35).toFixed(1)+'deg)';
    }
  }
  const rb=e.target.closest&&e.target.closest('.rbfolder');
  if(rb){
    const rr=rb.getBoundingClientRect();
    const px2=(e.clientX-rr.left)/rr.width-0.5, py2=(e.clientY-rr.top)/rr.height-0.5;
    rb.style.setProperty('--rty',(px2*10).toFixed(2)+'deg');
    rb.style.setProperty('--rtx',(-py2*8).toFixed(2)+'deg');
  }
  const rt=e.target.closest&&e.target.closest('.rate');
  if(rt){
    RATE_EL=rt;
    rt.querySelectorAll('.rstar').forEach(st=>{
      const r=st.getBoundingClientRect();
      const d=Math.abs(e.clientX-(r.left+r.width/2));
      const lift=Math.max(0,12-d/12);
      st.style.transform='translateY('+(-lift).toFixed(1)+'px)';
    });
  } else if(RATE_EL){
    RATE_EL.querySelectorAll('.rstar').forEach(st=>st.style.transform='');
    RATE_EL=null;
  }
  const el=e.target.closest&&e.target.closest('.spot');
  if(!el)return;
  const r=el.getBoundingClientRect();
  el.style.setProperty('--mx',(e.clientX-r.left)+'px');
  el.style.setProperty('--my',(e.clientY-r.top)+'px');
});
document.addEventListener('pointerup',()=>{
  if(FLIP.drag){
    const inner=document.querySelector('#flipcard .flipinner');
    if(inner){ inner.style.transition=''; inner.style.transform=''; }
    if(Math.abs(FLIP.dx)>70){
      MSTATE.aboutOpen=!MSTATE.aboutOpen;
      const el=document.getElementById('flipcard');
      if(el)el.classList.toggle('flipped',MSTATE.aboutOpen);
      FLIP.dragged=true;
    }
    FLIP.drag=null; FLIP.dx=0;
  }
  if(!CAR.drag)return;
  const st1=document.getElementById('carousel');
  if(st1)st1.classList.remove('dragging');
  let v=0;
  const smp=CAR.drag.samples;
  if(CAR.drag.moved&&smp.length>1){
    const t0=smp[0][0], a0=smp[0][1], t1=smp[smp.length-1][0], a1=smp[smp.length-1][1];
    if(t1>t0)v=Math.max(-1400,Math.min(1400,(a1-a0)/((t1-t0)/1000)));
  }
  const moved=CAR.drag.moved;
  CAR.drag=null;
  if(moved){
    /* momentum 0.6 -> tau 1.08; snap to nearest step on release */
    const tau=0.18+0.6*1.5;
    CAR.target=Math.round((CAR.angle+v*tau*0.55)/CAR.step)*CAR.step;
    CAR.vel=v; CAR.mode='spring'; CAR.hold=Date.now()+2800;
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&MENU.open){ MENU.open=false; renderMenu(); return; }
  if(!document.getElementById('carousel'))return;
  if(e.target.closest&&e.target.closest('input,textarea,select'))return;
  const snap=Math.round(CAR.angle/CAR.step)*CAR.step;
  if(e.key==='ArrowLeft'){ CAR.target=snap+CAR.step; CAR.mode='spring'; CAR.hold=Date.now()+2800; }
  else if(e.key==='ArrowRight'){ CAR.target=snap-CAR.step; CAR.mode='spring'; CAR.hold=Date.now()+2800; }
  else if(e.key==='Home')carGo(0);
  else if(e.key==='End')carGo(CAR.n-1);
});
load();
render();
setInterval(updateTimers,30000);
</script>
